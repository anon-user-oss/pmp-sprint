<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PMP Retake Command Center</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #162032;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --hard: #f59e0b;
      --correct: #22c55e;
      --correct-bg: rgba(34, 197, 94, 0.16);
      --wrong: #ef4444;
      --wrong-bg: rgba(239, 68, 68, 0.16);
      --border: #2a3950;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; max-width: 700px; margin: 0 auto; line-height: 1.5; }
    
    /* Landing / Mode Switcher */
    .hub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .hub-title { font-size: 1.05rem; font-weight: 800; color: var(--text); letter-spacing: 0.02em; }
    .stats { font-size: 0.78rem; color: var(--muted); font-weight: 600; text-align: right; }

    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .mode-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; transition: all 0.15s ease; }
    .mode-card.active-core { border-color: var(--accent); background: rgba(56, 189, 248, 0.12); }
    .mode-card.active-hard { border-color: var(--hard); background: rgba(245, 158, 11, 0.12); }
    .mode-title { font-size: 0.85rem; font-weight: 700; display: block; margin-bottom: 2px; }
    .mode-core-text { color: var(--accent); }
    .mode-hard-text { color: var(--hard); }
    .mode-sub { font-size: 0.72rem; color: var(--muted); display: block; }

    .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
    .filter-btn { background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 6px 11px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .filter-btn.active { background: var(--accent); color: #0b1120; border-color: var(--accent); }
    .filter-btn.active.hard-accent { background: var(--hard); border-color: var(--hard); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    .tag-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; gap: 8px; }
    .domain-tag { color: var(--accent); }
    .domain-tag.hard { color: var(--hard); }
    .trap-tag { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; padding: 2px 8px; border-radius: 4px; text-align: right; }
    .trap-tag.hard { background: rgba(245, 158, 11, 0.18); color: #fcd34d; }

    .question-text { font-size: 0.94rem; font-weight: 400; margin-bottom: 16px; color: #f1f5f9; }
    .options { display: flex; flex-direction: column; gap: 8px; }
    .option-btn { background: rgba(11, 17, 32, 0.75); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: left; font-size: 0.89rem; cursor: pointer; line-height: 1.4; }
    .option-btn.correct { background: var(--correct-bg); border-color: var(--correct); color: #bbf7d0; }
    .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: #fecaca; }

    .rationale { margin-top: 14px; padding: 12px; background: rgba(56, 189, 248, 0.1); border-left: 3px solid var(--accent); border-radius: 6px; font-size: 0.84rem; display: none; }
    .rationale.hard { background: rgba(245, 158, 11, 0.1); border-left-color: var(--hard); }
    .rationale strong { color: var(--accent); display: block; margin-bottom: 4px; }
    .rationale.hard strong { color: var(--hard); }

    .controls { display: flex; gap: 8px; }
    .nav-btn { flex: 1; padding: 12px 8px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.88rem; cursor: pointer; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); flex: 0.6; }
    .btn-primary { background: var(--accent); color: #0b1120; flex: 1.4; }
    .btn-primary.hard { background: var(--hard); }
    .btn-primary:disabled { opacity: 0.35; }
  </style>
</head>
<body>

  <div class="hub-header">
    <div class="hub-title">PMP SPRINT HUB</div>
    <div class="stats" id="stats">Score: 0/0</div>
  </div>

  <!-- Mode Switcher Landing Cards -->
  <div class="mode-grid">
    <button class="mode-card active-core" id="btn-mode-core" onclick="switchMode('CORE')">
      <span class="mode-title mode-core-text">Core Mindset (75)</span>
      <span class="mode-sub">Fast-twitch domain rules</span>
    </button>
    <button class="mode-card" id="btn-mode-hard" onclick="switchMode('HARD')">
      <span class="mode-title mode-hard-text">Hard Mode (25)</span>
      <span class="mode-sub">Long stems & verb traps</span>
    </button>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="ALL">All</button>
    <button class="filter-btn" data-filter="PROCESS">Process</button>
    <button class="filter-btn" data-filter="BUSINESS">Business Env</button>
    <button class="filter-btn" data-filter="PEOPLE">People</button>
    <button class="filter-btn" data-filter="MISSED">Missed (0)</button>
  </div>

  <div class="card">
    <div class="tag-row">
      <span class="domain-tag" id="domain-label">PROCESS</span>
      <span class="trap-tag" id="trap-label">Task</span>
    </div>
    <div class="question-text" id="question-text">Loading...</div>
    <div class="options" id="options-container"></div>
    <div class="rationale" id="rationale-box"></div>
  </div>

  <div class="controls">
    <button class="nav-btn btn-danger" onclick="resetProgress()">Reset</button>
    <button class="nav-btn btn-secondary" onclick="shuffleDeck()">Shuffle</button>
    <button class="nav-btn btn-primary" id="next-btn" disabled onclick="nextQuestion()">Next →</button>
  </div>

  <script>
    const fullBank = [
      // ==================== CORE BANK (1 - 75) ====================
      { id: 1, mode: "CORE", domain: "PROCESS", tag: "Task 2.2 • Scope", q: "During execution of a predictive infrastructure project, a key stakeholder asks the lead developer to add a minor reporting widget that takes four hours and costs nothing extra. The developer adds it. What should you do FIRST?", opts: ["Allow it since cost and schedule impact are zero.", "Evaluate the impact of the change and submit a formal change request through Perform Integrated Change Control.", "Reprimand the developer for gold plating.", "Update the WBS and scope baseline immediately."], a: 1, m: "Baseline Integrity: Any unapproved scope change in predictive projects—even a 'free' addition—must be evaluated and routed through formal change control." },
      { id: 2, mode: "CORE", domain: "PROCESS", tag: "Task 2.3 • Value Delivery", q: "Midway through a hybrid transformation project, the sponsor is concerned that stakeholders have not seen tangible business benefits yet despite green milestone reports. What is your best action?", opts: ["Reassure the sponsor that benefits realize at project closure.", "Crash the critical path to finish early.", "Collaborate with stakeholders and the product owner to reprioritize deliverables for earlier incremental value release.", "Submit a change request to cut remaining scope."], a: 2, m: "Value-Based Delivery: PMI expects incremental, early value delivery rather than waiting until the end of the lifecycle." },
      { id: 3, mode: "CORE", domain: "PROCESS", tag: "Task 2.7 • Quality", q: "Quality control inspections repeatedly catch the same configuration defect, causing rework and delays. What should you prioritize?", opts: ["Add more quality control inspectors at phase gates.", "Conduct root-cause analysis and update quality assurance processes to prevent defects from occurring.", "Use contingency reserves for overtime.", "Escalate the defect trend to the sponsor."], a: 1, m: "Prevention Over Inspection: Build quality into processes (Quality Assurance) rather than adding end-of-line inspections." },
      { id: 4, mode: "CORE", domain: "PROCESS", tag: "Task 2.5 • Procurement", q: "Three proposals arrive for a high-risk federal compliance module: Vendor A is cheapest but lacks compliance history; Vendor B is mid-priced with proven experience; Vendor C is premium. How do you guide selection?", opts: ["Select Vendor A to preserve cost baseline.", "Evaluate proposals against predefined source selection criteria balancing risk allocation, technical capability, and value.", "Ask the sponsor to pick their favorite.", "Split the contract between A and B."], a: 1, m: "Procurement Value Rule: Never fall for the lowest-cost trap; select based on agreed source selection criteria, risk, and value." },
      { id: 5, mode: "CORE", domain: "PROCESS", tag: "Task 2.1 • Integration", q: "You lead a complex system modernization where user workflows are rapidly evolving, but regulatory sign-offs mandate strict milestone documentation. Which approach should you recommend?", opts: ["Pure predictive waterfall.", "Pure agile with zero upfront documentation.", "A tailored hybrid approach combining iterative delivery for evolving workflows with predictive governance gates.", "Delay planning until all regulations freeze."], a: 2, m: "Tailoring Rule: Tailor delivery methodologies (predictive, agile, or hybrid) to match project uncertainty and governance requirements." },
      { id: 6, mode: "CORE", domain: "PROCESS", tag: "Task 2.6 • Finance", q: "An unexpected regulatory mandate requires adding an encryption layer not accounted for in the original scope or risk register. Which funding source covers this cost?", opts: ["Contingency reserve, approved by the PM.", "Management reserve, requested through formal change control.", "Cost baseline padding.", "Operations maintenance budget."], a: 1, m: "Reserve Governance: Contingency covers 'known-unknowns' (identified risks); Management reserve covers 'unknown-unknowns' (unforeseen in-scope work) via formal approval." },
      { id: 7, mode: "CORE", domain: "PROCESS", tag: "Task 2.10 • Risk", q: "During sprint planning, the team identifies a third-party API deprecation that could halt integration in two months. What should you do FIRST?", opts: ["Log it in the risk register, analyze probability and impact, and assign a risk owner.", "Immediately rewrite the integration layer.", "Escalate to the steering committee.", "Move the story to the bottom of the backlog."], a: 0, m: "Risk Process Order: Identify -> Analyze (Qualitative/Quantitative) -> Plan Response -> Implement. Never jump straight to action before assessing impact." },
      { id: 8, mode: "CORE", domain: "PROCESS", tag: "Task 2.4 • Schedule", q: "An external vendor informs you that a critical-path server delivery will be delayed by two weeks. You have zero float on that path and cannot add budget. Which technique should you evaluate FIRST?", opts: ["Crashing the critical path.", "Fast-tracking dependent activities to run in parallel where risk allows.", "Reducing project quality standards.", "Submitting a baseline extension immediately."], a: 1, m: "Schedule Compression: Crashing adds cost; Fast-tracking overlaps sequential activities at no direct cost (though it increases rework risk)." },
      { id: 9, mode: "CORE", domain: "PROCESS", tag: "Task 2.8 • Scope/Backlog", q: "In an agile project, a key stakeholder demands adding three high-priority features mid-sprint because of a new customer contract. How should you respond?", opts: ["Add the features to the current sprint immediately.", "Collaborate with the Product Owner to add them to the product backlog for reprioritization in the next sprint.", "Reject the features until the release finishes.", "Ask the team to work weekends to absorb them."], a: 1, m: "Agile Sprint Protection: Protect the active sprint backlog; route new requests to the Product Owner to prioritize in the Product Backlog." },
      { id: 10, mode: "CORE", domain: "PROCESS", tag: "Task 2.12 • Artifacts", q: "A new sponsor joins mid-project and asks for a single view of how project deliverables map back to business objectives and requirements. Which artifact should you share?", opts: ["Work Breakdown Structure (WBS).", "Requirements Traceability Matrix (RTM).", "RACI Chart.", "Issue Log."], a: 1, m: "Artifact Precision: The Requirements Traceability Matrix links product requirements from origin through deliverables that satisfy business objectives." },
      { id: 11, mode: "CORE", domain: "PROCESS", tag: "Task 2.11 • Change Control", q: "The Change Control Board (CCB) approves a major scope addition that extends the schedule by three weeks. What must the project manager do NEXT?", opts: ["Instruct the team to begin work immediately.", "Update the project management plan, scope baseline, schedule baseline, and communicate updates to stakeholders.", "Log the decision in the lessons learned register and wait.", "Re-baseline the project charter."], a: 1, m: "Post-CCB Execution: After CCB approval, always update baselines/plans and communicate changes to affected stakeholders before executing." },
      { id: 12, mode: "CORE", domain: "PROCESS", tag: "Task 2.13 • Closure", q: "All deliverables have been accepted by the customer and final payments are processed, but one vendor dispute remains open. Can you close the project?", opts: ["Yes, vendor disputes are handled by legal post-closure.", "Follow formal procurement closure procedures, document the unresolved claim, and complete administrative closure per governance.", "Keep the entire project team on billing until the dispute settles.", "Cancel the vendor contract retroactively."], a: 1, m: "Closure Governance: Follow organizational procurement closure rules and archive lessons learned; unresolved claims follow formal dispute resolution procedures." },
      { id: 13, mode: "CORE", domain: "PROCESS", tag: "Task 2.6 • Earned Value", q: "Your project's CPI is 0.82 and SPI is 1.05. What does this indicate about project performance?", opts: ["Under budget and behind schedule.", "Over budget and ahead of schedule.", "Under budget and ahead of schedule.", "Over budget and behind schedule."], a: 1, m: "EVM Rule: Less than 1.0 is unfavorable; greater than 1.0 is favorable. CPI 0.82 = over budget; SPI 1.05 = ahead of schedule." },
      { id: 14, mode: "CORE", domain: "PROCESS", tag: "Task 2.9 • Communications", q: "A remote stakeholder complains they are missing critical status updates, even though you email a 20-page weekly report every Friday. What should you do?", opts: ["Highlight key sections in yellow for that stakeholder.", "Review the Communications Management Plan and stakeholder engagement needs to tailor format and frequency.", "Add the stakeholder to daily standups.", "Send the report twice a week."], a: 1, m: "Tailored Communication: When communication fails, revisit stakeholder preferences and update the Communications Management Plan." },
      { id: 15, mode: "CORE", domain: "PROCESS", tag: "Task 2.6 • EVM Forecasting", q: "Your project has a Budget at Completion (BAC) of $500,000, Earned Value (EV) of $200,000, and Actual Cost (AC) of $250,000. Assuming current cost efficiency continues, what is the Estimate at Completion (EAC)?", opts: ["$550,000", "$625,000", "$450,000", "$600,000"], a: 1, m: "EVM Math: CPI = EV / AC = 200k / 250k = 0.80. Typical EAC = BAC / CPI = $500,000 / 0.80 = $625,000." },
      { id: 16, mode: "CORE", domain: "PROCESS", tag: "Task 2.5 • Contract Types", q: "You need to hire a specialized AI research firm for an R&D prototype where the exact scope of work cannot be clearly defined upfront, and you want to incentivize cost control. Which contract type fits best?", opts: ["Firm Fixed Price (FFP)", "Cost Plus Incentive Fee (CPIF)", "Cost Plus Percentage of Cost (CPPC)", "Time and Materials (T&M) with no cap"], a: 1, m: "Contract Selection: When scope is evolving, use cost-reimbursable; CPIF shares cost savings/overruns to align incentives." },
      { id: 17, mode: "CORE", domain: "PROCESS", tag: "Task 2.7 • Quality Control", q: "A control chart for a manufacturing deliverable shows seven consecutive data points trending upward below the upper control limit. What does this 'Rule of Seven' indicate?", opts: ["The process is within control limits and requires no action.", "An assignable cause of non-random variation exists; investigate the process immediately.", "The upper specification limit must be widened.", "Inspection frequency should be reduced."], a: 1, m: "Rule of Seven: Seven consecutive points on one side of the mean or trending in one direction indicates a non-random trend requiring investigation." },
      { id: 18, mode: "CORE", domain: "PROCESS", tag: "Task 2.10 • Risk Responses", q: "To address a severe hurricane risk to a coastal data center build, the team decides to lease a secondary inland facility to host primary servers instead. Which risk response strategy is this?", opts: ["Mitigate", "Transfer", "Avoid", "Accept"], a: 2, m: "Risk Strategies: Relocating the asset completely eliminates the coastal hurricane threat—that is Avoidance." },
      { id: 19, mode: "CORE", domain: "PROCESS", tag: "Task 2.10 • Risk Responses", q: "A senior cloud architect may leave the company midway through a critical migration. You cross-train two mid-level engineers on her proprietary workflows now. Which strategy is this?", opts: ["Avoid", "Mitigate", "Transfer", "Exploit"], a: 1, m: "Risk Mitigation: Cross-training does not stop her from leaving, but it lowers the impact if she does." },
      { id: 20, mode: "CORE", domain: "PROCESS", tag: "Task 2.4 • Agile Metrics", q: "An agile team's velocity has dropped from 38 points to 24 points over the last three sprints, and cycle time is climbing. What should you examine FIRST with the team?", opts: ["Increase story point estimates for upcoming items.", "Review the Kanban/task board to identify bottlenecks, excessive Work in Progress (WIP), or unresolved impediments.", "Extend sprint length from two weeks to three weeks.", "Replace underperforming developers."], a: 1, m: "Flow & Bottlenecks: Rising cycle time and dropping velocity point to excessive WIP or blocked dependencies." },
      { id: 21, mode: "CORE", domain: "PROCESS", tag: "Task 2.2 • Scope Validation", q: "During Validate Scope, the customer rejects a completed deliverable because it fails to meet one of the documented acceptance criteria. What should the project manager do NEXT?", opts: ["Submit a change request to modify the acceptance criteria.", "Document the non-conformance, issue a change request for defect repair, and have the team rework the deliverable.", "Close the phase and fix it during warranty.", "Ask the sponsor to override the customer."], a: 1, m: "Validate Scope: Rejected deliverables require formal defect repair change requests and rework." },
      { id: 22, mode: "CORE", domain: "PROCESS", tag: "Task 2.8 • Agile Artifacts", q: "In an agile project, who is accountable for ensuring the Product Backlog is ordered to maximize business value and communicating product vision?", opts: ["Scrum Master / Agile Coach", "Product Owner", "Project Sponsor", "Development Team Lead"], a: 1, m: "Agile Roles: The Product Owner owns the Product Backlog, prioritization, and maximizing business value." },
      { id: 23, mode: "CORE", domain: "PROCESS", tag: "Task 2.11 • Change Control", q: "A team member suggests a technical refactoring improvement that reduces long-term maintenance cost without changing external functionality, schedule, or budget. How should it be handled in a predictive project?", opts: ["Implement it silently since baselines aren't affected.", "Assess whether it impacts any project baselines or quality plans; if it alters technical specs or baseline components, submit a change request.", "Ask the sponsor for verbal approval.", "Wait until project closure."], a: 1, m: "Change Discipline: Always evaluate technical changes for hidden impacts on quality, risk, or baselines before implementing." },
      { id: 24, mode: "CORE", domain: "PROCESS", tag: "Task 2.4 • Schedule Network", q: "Activity A (5 days) and Activity B (8 days) both feed into Activity C (4 days), which is the final activity. If Activity A is delayed by 2 days, what happens to the total project duration?", opts: ["Increases by 2 days.", "Remains 12 days because Activity A has 3 days of total float.", "Increases by 1 day.", "Decreases by 2 days."], a: 1, m: "Critical Path & Float: Critical path is B (8) + C (4) = 12 days. Path A + C = 9 days, giving Activity A 3 days of float." },
      { id: 25, mode: "CORE", domain: "PROCESS", tag: "Task 2.1 • Methodology", q: "An organization transitioning from waterfall to agile insists on keeping detailed upfront 18-month Gantt charts while running two-week sprints. What is the PM's best approach?", opts: ["Refuse to create the Gantt chart.", "Educate leadership on rolling-wave planning and establish a high-level milestone roadmap mapped to iterative release goals.", "Abandon agile sprints and revert to waterfall.", "Create fake Gantt tasks to satisfy management."], a: 1, m: "Hybrid Translation: Bridge executive governance and agile execution using high-level release roadmaps and rolling-wave planning." },
      { id: 26, mode: "CORE", domain: "PROCESS", tag: "Task 2.12 • Knowledge Mgmt", q: "Midway through a multi-year program, two key lead engineers resign, taking critical architectural context with them. What should the PM have established earlier to prevent this?", opts: ["Strict non-compete agreements.", "A continuous lessons learned repository and collaborative knowledge-sharing practices (e.g., pair programming, shared wikis).", "Higher overtime pay.", "A larger management reserve."], a: 1, m: "Knowledge Management: Capture tacit and explicit knowledge continuously throughout the project." },
      { id: 27, mode: "CORE", domain: "PROCESS", tag: "Task 2.5 • Procurement", q: "A time-and-materials (T&M) vendor is billing significantly faster than anticipated, threatening to exhaust the contract ceiling before 60% of the work is done. What should you do FIRST?", opts: ["Terminate the contract immediately.", "Audit vendor timesheets/deliverables against the SOW, evaluate burn rate, and negotiate corrective controls or scope caps.", "Request management reserve to cover the overrun.", "Switch the contract to Firm Fixed Price unilaterally."], a: 1, m: "Procurement Control: Audit burn rates, deliverables, and not-to-exceed caps before taking contract action." },
      { id: 28, mode: "CORE", domain: "PROCESS", tag: "Task 2.3 • MVP / Value", q: "Stakeholders are divided on 40 potential features for a new customer portal, delaying project kickoff. How should you help them move forward?", opts: ["Build all 40 features in Phase 1.", "Facilitate a prioritization workshop (e.g., MoSCoW or Kano) to define a Minimum Viable Product (MVP) for rapid feedback.", "Let the IT director pick the top 10.", "Extend the planning phase by two months."], a: 1, m: "MVP Mindset: Use structured prioritization to isolate the Minimum Viable Product (MVP) and deliver fast value." },
      { id: 29, mode: "CORE", domain: "PROCESS", tag: "Task 2.7 • Cost of Quality", q: "To avoid expensive post-deployment production outages, your team invests heavily in automated unit testing, peer code reviews, and developer training. Which Cost of Quality category is this?", opts: ["Internal Failure Costs", "External Failure Costs", "Prevention Costs", "Appraisal Costs"], a: 2, m: "Cost of Quality: Training, process design, and built-in quality practices are Prevention Costs." },
      { id: 30, mode: "CORE", domain: "PROCESS", tag: "Task 2.10 • Risk Audit", q: "During execution, you want to evaluate whether your team's risk response plans and overall risk management processes are actually working effectively. Which tool should you use?", opts: ["Qualitative Risk Analysis", "Risk Audit", "Monte Carlo Simulation", "Sensitivity Analysis"], a: 1, m: "Risk Process Review: A Risk Audit examines and documents the effectiveness of risk responses and the risk management process." },
      { id: 31, mode: "CORE", domain: "PROCESS", tag: "Task 2.6 • Budgeting", q: "When aggregating cost estimates from individual work packages up through control accounts to establish the cost baseline, which reserve is INCLUDED inside the cost baseline?", opts: ["Management Reserve", "Contingency Reserve", "Operational Overhead Reserve", "Profit Margin"], a: 1, m: "Cost Baseline Formula: Work Package Estimates + Contingency Reserves = Cost Baseline." },
      { id: 32, mode: "CORE", domain: "PROCESS", tag: "Task 2.9 • Stakeholder Comms", q: "A key regulatory stakeholder has high power over your project's approval but currently shows low interest in day-to-day updates. How should you manage them per the Power/Interest Grid?", opts: ["Monitor only with minimal effort.", "Keep Satisfied—provide concise, targeted executive compliance updates without overwhelming them.", "Manage Closely with daily check-ins.", "Keep Informed of every technical sprint task."], a: 1, m: "Power/Interest Grid: High Power + Low Interest = Keep Satisfied." },
      { id: 33, mode: "CORE", domain: "PROCESS", tag: "Task 2.8 • Backlog Refinement", q: "During sprint planning, the team spends three hours arguing over unclear user stories, leaving little time to plan sprint tasks. What should you recommend for future sprints?", opts: ["Extend sprint planning to a full day.", "Hold regular Backlog Refinement sessions mid-sprint so upcoming stories meet the Definition of Ready (DoR).", "Have the Scrum Master write all acceptance criteria.", "Skip estimation and start coding."], a: 1, m: "Backlog Refinement: Ongoing refinement ensures top backlog items meet the Definition of Ready before Sprint Planning." },
      { id: 34, mode: "CORE", domain: "PROCESS", tag: "Task 2.13 • Phase Gate", q: "At the end of Phase 2 of a predictive construction project, two non-critical documentation items are incomplete, while all safety and engineering deliverables are signed off. What should happen at the phase gate?", opts: ["Automatically halt Phase 3 until every paper document is filed.", "Review phase gate criteria with governance stakeholders to decide whether to proceed conditionally while closing minor gaps.", "Delete the two documentation items from the WBS.", "Restart Phase 2 from scratch."], a: 1, m: "Phase Gate Governance: Phase gates evaluate performance against criteria to pass, pass with conditions, hold, or terminate." },
      { id: 35, mode: "CORE", domain: "PROCESS", tag: "Task 2.11 • Configuration Mgmt", q: "Two engineering teams accidentally overwrite each other's API schema changes because both worked off outdated specification files. Which system failed?", opts: ["Earned Value Management System", "Configuration Management and Version Control System", "Resource Breakdown Structure", "Issue Escalation Matrix"], a: 1, m: "Configuration Management: Tracks and controls functional specs, versions, and documentation consistency." },
      { id: 36, mode: "CORE", domain: "BUSINESS", tag: "Task 3.2 • Compliance", q: "A developer flags a newly enacted data privacy law affecting user storage, though an internal compliance audit isn't scheduled for nine months. What should you do FIRST?", opts: ["Continue building and address findings during the audit.", "Assess the compliance requirement, evaluate noncompliance consequences, and integrate controls into the project plan.", "Log it as a low-priority risk for closure.", "Ask legal for a temporary waiver."], a: 1, m: "Proactive Compliance: Integrate regulatory and compliance controls immediately—never wait for an audit." },
      { id: 37, mode: "CORE", domain: "BUSINESS", tag: "Task 3.7 • Org Change", q: "Your project replaces a legacy case-management system for 400 staff. Technical testing is green, but department supervisors are skeptical. What is your best action?", opts: ["Launch on schedule and have leadership mandate usage.", "Assess organizational culture and readiness, identify resistance drivers, and execute targeted engagement and training.", "Delay launch until skepticism disappears.", "Close the project post-deployment since adoption is operational."], a: 1, m: "Organizational Readiness: Assess cultural readiness and proactively manage change adoption rather than forcing mandates." },
      { id: 38, mode: "CORE", domain: "BUSINESS", tag: "Task 3.8 • External Env", q: "Halfway through a 12-month product build, a competitor launches a disruptive AI feature that renders two of your planned features obsolete. What do you FIRST?", opts: ["Continue building the signed-off scope.", "Evaluate the external shift's impact on business value and collaborate with stakeholders to reprioritize scope/backlog.", "Cancel the project immediately.", "Withhold the competitor news to protect team morale."], a: 1, m: "External Vigilance: Continuously scan the external environment and adapt plans/backlogs when market shifts impact business value." },
      { id: 39, mode: "CORE", domain: "BUSINESS", tag: "Task 3.4 & 3.5 • Risk vs Issue", q: "A key vendor informs you today that a hardware shipment is held at customs, blocking tomorrow's integration test. How do you handle this?", opts: ["Add it to the risk register and score its probability.", "Log it in the issue log, assess immediate impact, and collaborate on workaround options to remove the blocker.", "Escalate immediately to the sponsor.", "Spend contingency reserves without evaluating options."], a: 1, m: "Risk vs. Issue: Once a risk occurs, it is an ISSUE. Log it in the issue log and resolve blockers at the lowest level." },
      { id: 40, mode: "CORE", domain: "BUSINESS", tag: "Task 3.1 • Benefits Realization", q: "Six months into a multi-phase enterprise rollout, senior leadership questions whether the investment is still justified due to budget tightening. Which document defines how value will be measured and sustained?", opts: ["Project Charter.", "Benefits Management Plan.", "Scope Management Plan.", "Quality Checklist."], a: 1, m: "Benefits Governance: The Benefits Management Plan outlines target benefits, metrics, ownership, and timeframes." },
      { id: 41, mode: "CORE", domain: "BUSINESS", tag: "Task 3.3 • Governance", q: "During an agile release, the team discovers that a key security sign-off requires formal architecture review board approval before production deployment. What should you do?", opts: ["Deploy to production anyway to preserve sprint velocity.", "Incorporate the organizational governance gate into the Definition of Done (DoD) and release plan.", "Ask the Product Owner to waive the security review.", "Switch the entire project to waterfall."], a: 1, m: "Governance Alignment: Organizational governance gates are non-negotiable; embed them into your Definition of Done." },
      { id: 42, mode: "CORE", domain: "BUSINESS", tag: "Task 3.6 • Business Value", q: "Two requested features have equal development effort: Feature X aligns with a core strategic regulatory mandate; Feature Y is a popular cosmetic UI request from internal users. How should you guide prioritization?", opts: ["Prioritize Feature Y for quick internal adoption.", "Prioritize Feature X because it delivers higher strategic and compliance business value.", "Split sprint capacity 50/50 between both.", "Let the developers vote on which one to build."], a: 1, m: "Strategic Alignment: Always prioritize work based on strategic business value, risk reduction, and compliance impact." },
      { id: 43, mode: "CORE", domain: "BUSINESS", tag: "Task 3.2 • Compliance Risk", q: "A vendor delivers a software component using an open-source license that conflicts with your company's commercial intellectual property policy. What should you do FIRST?", opts: ["Ignore it since the code works properly.", "Document the compliance breach, assess legal/IP impact, and engage the vendor and legal counsel for remediation.", "Replace the vendor immediately.", "Hide the license file from the repository."], a: 1, m: "Compliance Integrity: Escalate and remediate IP/licensing violations immediately; never ship non-compliant deliverables." },
      { id: 44, mode: "CORE", domain: "BUSINESS", tag: "Task 3.8 • Regulatory Shift", q: "A new federal cybersecurity directive is announced mid-project, tightening encryption standards for cloud workloads. What is your FIRST step?", opts: ["Immediately purchase new encryption tools.", "Analyze the directive's impact on project scope, schedule, cost, and compliance baselines with technical leads.", "Wait until the directive's enforcement deadline next year.", "Inform the sponsor the project will miss its deadline."], a: 1, m: "Impact Assessment First: Whenever an external regulation shifts, assess the exact impact on project baselines before proposing changes." },
      { id: 45, mode: "CORE", domain: "BUSINESS", tag: "Task 3.7 • Knowledge Transfer", q: "As your project transitions a new cloud platform to internal IT operations, the operations team expresses anxiety about supporting unfamiliar architecture. What ensures sustainable adoption?", opts: ["Hand over the architecture diagram at closure.", "Execute structured knowledge transfer, joint shadowing, and operational readiness training prior to handover.", "Keep the project team on permanent support.", "Log an operational risk and close the project."], a: 1, m: "Sustainable Transition: Operational readiness requires structured knowledge transfer and enablement before project closure." },
      { id: 46, mode: "CORE", domain: "BUSINESS", tag: "Task 3.1 • Business Case", q: "During execution of a retail analytics project, a corporate merger shifts company strategy away from brick-and-mortar stores toward e-commerce only. What should you do FIRST?", opts: ["Continue executing the approved charter until told otherwise.", "Meet with the sponsor and governance board to re-evaluate the business case and strategic alignment of the project.", "Pivot the project to e-commerce on your own authority.", "Accelerate the current schedule to finish before budgets freeze."], a: 1, m: "Strategic Viability: When corporate strategy shifts, validate whether the project's Business Case still holds value with the sponsor." },
      { id: 47, mode: "CORE", domain: "BUSINESS", tag: "Task 3.2 • Compliance Audit", q: "An internal quality and compliance audit reveals that two sprint teams skipped mandatory accessibility testing to meet a release deadline. What should you do?", opts: ["Accept the technical debt and move to the next feature.", "Halt release sign-off for non-compliant items, log remediation stories, and reinforce compliance in the Definition of Done.", "Ask the customer to sign a liability waiver.", "Reassign the QA testers."], a: 1, m: "Non-Negotiable Compliance: Compliance standards cannot be traded off for schedule speed." },
      { id: 48, mode: "CORE", domain: "BUSINESS", tag: "Task 3.3 • PMO Governance", q: "You join a matrix organization with a Directive PMO. Your team wants to use lightweight Kanban boards instead of the PMO's standardized stage-gate templates. What should you do?", opts: ["Ignore the PMO templates since agile values working software over documentation.", "Consult with the PMO to tailor their governance framework so Kanban metrics map cleanly to required stage-gate controls.", "Escalate to the CEO to disband the PMO.", "Maintain two completely separate sets of project books."], a: 1, m: "PMO & Tailoring: A Directive PMO enforces compliance; collaborate to tailor governance artifacts rather than bypassing rules." },
      { id: 49, mode: "CORE", domain: "BUSINESS", tag: "Task 3.6 • Value Realization", q: "Your software product launched on time and under budget, but 60 days post-launch, customer adoption metrics are 70% below target. What does this indicate?", opts: ["The project was a complete success because the triple constraint was met.", "Outputs were delivered, but expected business outcomes and value realization are falling short; analyze user feedback and adoption barriers.", "The operations team failed to market the tool.", "No action is needed since the project is closed."], a: 1, m: "Outputs vs. Outcomes: Delivering features on time is only an output; true project success requires realizing intended business outcomes." },
      { id: 50, mode: "CORE", domain: "BUSINESS", tag: "Task 3.7 • Change Champions", q: "During an enterprise ERP rollout across 12 regional offices, resistance is highest in regional billing departments. What is the most effective change management tactic?", opts: ["Send weekly executive warning emails to billing managers.", "Recruit respected peer 'change champions' within billing to co-design workflows, pilot early, and peer-coach colleagues.", "Delay billing migration until all other departments finish.", "Outsource regional billing during the cutover."], a: 1, m: "Change Adoption: Peer champions and early user involvement build organic trust far better than top-down mandates." },
      { id: 51, mode: "CORE", domain: "BUSINESS", tag: "Task 3.8 • Supply Chain", q: "Geopolitical tariffs suddenly increase the import cost of specialized networking hardware by 35% before your purchase order is finalized. What should you do FIRST?", opts: ["Cancel the hardware order.", "Assess budget impact, evaluate alternative domestic suppliers or specifications, and present options to the sponsor/CCB.", "Use contingency reserves without notifying anyone.", "Force the vendor to absorb the tariff."], a: 1, m: "External Economic Shifts: Analyze cost/schedule impacts and explore alternative sourcing options before requesting reserve funds." },
      { id: 52, mode: "CORE", domain: "BUSINESS", tag: "Task 3.2 • Data Sovereignty", q: "Your cloud application is expanding to European users, and a stakeholder asks to replicate production databases to a US server for faster analytics. What must you verify FIRST?", opts: ["Network latency benchmarks.", "GDPR and cross-border data residency compliance requirements with legal/privacy officers.", "Storage cost differences between regions.", "Database backup schedules."], a: 1, m: "Regulatory Boundaries: Cross-border data storage triggers strict legal/compliance constraints that supersede technical convenience." },
      { id: 53, mode: "CORE", domain: "BUSINESS", tag: "Task 3.1 • NPV Selection", q: "Leadership is choosing between two mutually exclusive projects: Project Alpha has an NPV of $420,000 and payback period of 18 months; Project Beta has an NPV of $610,000 and payback period of 20 months. Based purely on financial value, which should be selected?", opts: ["Project Alpha because its payback period is faster.", "Project Beta because higher positive Net Present Value (NPV) maximizes overall financial return.", "Neither, because payback exceeds 12 months.", "Split funding across both projects."], a: 1, m: "Financial Selection Rule: When comparing mutually exclusive investments, always prefer higher NPV." },
      { id: 54, mode: "CORE", domain: "BUSINESS", tag: "Task 3.4 • Escalation vs Action", q: "A third-party regulatory agency delays issuing an environmental permit needed for site excavation, and the delay exceeds your project's contingency thresholds and authority. What should you do?", opts: ["Begin excavation without the permit to protect the critical path.", "Escalate the issue to the project sponsor and governance committee with an impact analysis and mitigation options.", "Log it in the risk register and wait.", "Reassign the excavation crew indefinitely."], a: 1, m: "Appropriate Escalation: When external threats breach project tolerance thresholds outside PM authority, escalate with clear options." },
      { id: 55, mode: "CORE", domain: "BUSINESS", tag: "Task 3.7 • Org Culture", q: "You are hired to lead an agile transformation in a traditional, hierarchical organization where managers punish missed estimates. Teams are padding estimates by 300%. What is the root cultural issue to address?", opts: ["Teach the teams better Planning Poker techniques.", "Coach leadership on psychological safety and empirical forecasting so estimates are treated as forecasts rather than rigid commitments.", "Enforce stricter time-tracking software.", "Replace team leads who pad estimates."], a: 1, m: "Cultural Alignment: Agile practices fail in punitive cultures; shift leaders toward psychological safety and empirical learning." },
      { id: 56, mode: "CORE", domain: "BUSINESS", tag: "Task 3.6 • Incremental ROI", q: "Your project is building a 10-module enterprise platform. Module 1 and Module 2 alone can automate 65% of manual processing costs. What should you recommend?", opts: ["Hold Modules 1 and 2 until all 10 modules pass final integration testing.", "Release Modules 1 and 2 early to capture immediate cost savings and fund/validate subsequent modules.", "Reduce testing on Modules 3–10.", "Re-estimate the entire project."], a: 1, m: "Early Value Capture: Releasing high-value increments early accelerates ROI and reduces overall project risk." },
      { id: 57, mode: "CORE", domain: "BUSINESS", tag: "Task 3.3 • Compliance Escalation", q: "A senior business stakeholder pressures you to bypass a mandatory financial segregation-of-duties control to speed up user acceptance testing. How should you respond?", opts: ["Temporarily disable the control during UAT and re-enable it later.", "Refuse to bypass the compliance control, explain the audit/regulatory risk, and escalate to governance/compliance if pressured further.", "Ask the developer to create a hidden admin account.", "Log it as an accepted risk."], a: 1, m: "Ethical & Compliance Backbone: Never compromise mandatory compliance, ethics, or audit controls." },
      { id: 58, mode: "CORE", domain: "BUSINESS", tag: "Task 3.8 • Tech Obsolescence", q: "A core open-source framework your team relies on announces end-of-life security support six months before your product's planned launch. What should you do FIRST?", opts: ["Continue using it since it still compiles.", "Assess technical migration effort, security compliance risks, and schedule/cost impacts with the architecture team.", "Immediately rewrite the application in a new language.", "Cancel the launch."], a: 1, m: "External Tech Risk: Quantify migration options and impacts before executing a technical pivot." },
      { id: 59, mode: "CORE", domain: "BUSINESS", tag: "Task 3.1 • Benefit Ownership", q: "During project closure, you are preparing to hand off the deliverables to business operations. Who is responsible for tracking and realizing the long-term financial benefits after the project closes?", opts: ["The Project Manager.", "The Business Owner / Benefit Owner designated in the Benefits Management Plan.", "The Scrum Master.", "The PMO Director."], a: 1, m: "Benefit Ownership: The designated Business/Benefit Owner is accountable for sustaining and measuring post-project benefits." },
      { id: 60, mode: "CORE", domain: "BUSINESS", tag: "Task 3.7 • Training & Enablement", q: "A new customer service CRM goes live next Monday, but 40% of support agents haven't completed mandatory system training due to high call volumes. What should you recommend?", opts: ["Go live on Monday anyway and let agents learn on live calls.", "Collaborate with operations leadership to schedule staggered coverage for training or adjust cutover readiness criteria to prevent service disruption.", "Cancel training and send a PDF manual.", "Blame the call center managers in the status report."], a: 1, m: "Operational Readiness: Collaborate to resolve operational readiness gaps before cutover." },
      { id: 61, mode: "CORE", domain: "PEOPLE", tag: "Task 1.1 • Common Vision", q: "During a sprint review, two department heads argue over project success—one measures deployment speed, the other measures zero defects. What should you do FIRST?", opts: ["Side with the more senior stakeholder.", "Facilitate a session to uncover the root cause of misalignment and establish a shared definition of success.", "Refer both to the charter and end the meeting.", "Have the team work overtime to satisfy both."], a: 1, m: "Shared Vision (Task 1.1): Diagnose root causes of stakeholder misalignment and facilitate consensus." },
      { id: 62, mode: "CORE", domain: "PEOPLE", tag: "Task 1.3 • Lead Team", q: "A self-organizing agile team is deadlocked between two technical architectures, causing daily standups to drag past 40 minutes. As a servant leader, what should you do?", opts: ["Make the architectural decision yourself.", "Facilitate a dedicated technical spike or decision workshop empowering the team to evaluate trade-offs and choose.", "Escalate to the enterprise architecture board.", "Extend daily standups permanently."], a: 1, m: "Servant Leadership (Task 1.3): Coach, facilitate, and remove impediments so the team can make informed decisions." },
      { id: 63, mode: "CORE", domain: "PEOPLE", tag: "Task 1.1 • Conflict/Vision", q: "A newly appointed Product Owner wants to pivot the product roadmap away from the original business case without consulting key operational stakeholders. How should you intervene?", opts: ["Let the Product Owner pivot immediately since they own the backlog.", "Facilitate alignment between the Product Owner, sponsor, and key stakeholders to validate strategic value before shifting.", "Refuse to update the backlog.", "Escalate to HR."], a: 1, m: "Aligned Vision: Major strategic pivots require stakeholder alignment against business value." },
      { id: 64, mode: "CORE", domain: "PEOPLE", tag: "Task 1.3 • Team Empowerment", q: "A junior team member hesitates to share a potential design flaw during retrospective because senior engineers dominate the conversation. What should you do?", opts: ["Ask the junior member to email you privately after meetings.", "Establish psychological safety and use structured facilitation techniques (like silent brainstorming) so all voices are heard.", "Speak on behalf of the junior engineer.", "Remove senior engineers from the retrospective."], a: 1, m: "Psychological Safety: Foster an inclusive environment where every team member contributes openly." },
      { id: 65, mode: "CORE", domain: "PEOPLE", tag: "Task 1.3 • Situational Leadership", q: "A newly formed team is struggling with agile ceremonies and lacks clarity on roles, causing sprint velocity to stall. Which leadership style is most appropriate right now?", opts: ["Hands-off delegation.", "Coaching and mentoring the team on agile practices while clarifying roles and expectations.", "Command-and-control micromanagement.", "Replacing underperforming members."], a: 1, m: "Situational Leadership: Newly formed teams need active coaching and clarity before full self-organization." },
      { id: 66, mode: "CORE", domain: "PEOPLE", tag: "Task 1.1 • Stakeholder Alignment", q: "Key stakeholders from Finance and Engineering have conflicting interpretations of a major milestone deliverable's acceptance criteria. What is your FIRST action?", opts: ["Ask the sponsor to pick one interpretation.", "Bring both groups together to review the requirements, clarify ambiguity, and document mutually agreed acceptance criteria.", "Build both versions to be safe.", "Defer the milestone."], a: 1, m: "Collaborative Alignment: Resolve ambiguous expectations directly with stakeholders." },
      { id: 67, mode: "CORE", domain: "PEOPLE", tag: "Task 1.3 • Conflict Resolution", q: "Two senior developers frequently clash in code reviews over coding standards, creating tension across the entire team. What is the best conflict resolution approach?", opts: ["Smooth over the tension and tell them to be polite.", "Facilitate a problem-solving (collaborating) session with the team to establish shared team coding standards in the Team Charter.", "Force them to adopt your personal coding style.", "Separate them onto different projects."], a: 1, m: "Collaborate / Problem-Solve: Confront issues collaboratively to reach consensus codified in the Team Charter." },
      { id: 68, mode: "CORE", domain: "PEOPLE", tag: "Task 1.1 • Vision Drift", q: "Midway through a 9-month project, team members tell you they feel disconnected from why their daily tasks matter to end users. What should you do?", opts: ["Remind them of their contractual job descriptions.", "Organize a session with the Product Owner and end users to reconnect the team with customer outcomes and product vision.", "Offer spot bonuses for sprint completion.", "Increase daily status reporting."], a: 1, m: "Purpose & Vision: Connect the team directly with customer outcomes and product vision." },
      { id: 69, mode: "CORE", domain: "PEOPLE", tag: "Task 1.3 • Servant Leadership", q: "A functional manager pulls your lead QA engineer onto an urgent operational ticket for three days without consulting you, jeopardizing your sprint goal. What should you do FIRST?", opts: ["Report the functional manager to senior executives.", "Meet directly with the functional manager to discuss project impact, resource agreements, and negotiate coverage.", "Ask the developers to skip QA testing this sprint.", "Accept the delay silently."], a: 1, m: "Collaborative Negotiation: Address resource conflicts directly with functional managers using project impact data." },
      { id: 70, mode: "CORE", domain: "PEOPLE", tag: "Task 1.1 • Sponsor Misalignment", q: "Your project sponsor frequently bypasses you to assign ad-hoc tasks directly to developers, disrupting sprint commitments and confusing priorities. How should you handle this?", opts: ["Tell the developers to ignore the sponsor.", "Meet privately with the sponsor to align on governance, explain how direct tasking disrupts value delivery, and channel requests through the backlog.", "Add a buffer to every sprint to absorb sponsor requests.", "Escalate to the PMO."], a: 1, m: "Protecting Team & Alignment: Educate sponsors on how unified backlog governance protects their own priorities." },
      { id: 71, mode: "CORE", domain: "PEOPLE", tag: "Task 1.3 • Emotional Intelligence", q: "During a tense post-incident review, a team lead becomes defensive and blames another team for a deployment failure. How should you respond?", opts: ["Publicly reprimand the team lead for unprofessionalism.", "Use emotional intelligence to de-escalate blame, refocus the room on blameless system/process improvement, and facilitate constructive root-cause analysis.", "End the meeting immediately.", "Escalate the lead's behavior to HR."], a: 1, m: "Emotional Intelligence: De-escalate defensiveness and pivot toward blameless systemic learning." },
      { id: 72, mode: "CORE", domain: "PEOPLE", tag: "Task 1.1 • Charter & Vision", q: "You are taking over an in-flight project where three key stakeholders hold completely different expectations about final deliverables. What is your FIRST step?", opts: ["Review the Project Charter and Stakeholder Register, then hold a joint alignment workshop to establish a unified baseline vision.", "Continue executing the current schedule to avoid losing momentum.", "Ask each stakeholder to send you a separate wish list.", "Rewrite the charter unilaterally."], a: 0, m: "Diagnose & Align First: Verify foundational governance docs and align stakeholders around one shared vision." },
      { id: 73, mode: "CORE", domain: "PEOPLE", tag: "Task 1.3 • Delegation & Trust", q: "A high-performing, mature agile team asks to run their own sprint retrospectives and dependency coordination without your direct facilitation. How should you respond?", opts: ["Refuse, because facilitating ceremonies is strictly the PM's job.", "Support their self-organization, empower them to lead the sessions, and remain available for coaching and impediment removal.", "Observe silently and grade their facilitation.", "Assign a senior developer as formal boss."], a: 1, m: "Empowerment & Maturity: As teams mature, step back from directing and empower full team autonomy." },
      { id: 74, mode: "CORE", domain: "PEOPLE", tag: "Task 1.1 • Value Alignment", q: "During backlog prioritization, Marketing wants customer-facing cosmetic features while Operations insists on backend stability upgrades. How do you facilitate consensus?", opts: ["Let Marketing win because they generate revenue.", "Facilitate a joint value-scoring exercise weighing customer impact, operational risk, and strategic goals with the Product Owner.", "Alternate one marketing story and one ops story blindly.", "Ask the sponsor to break every tie."], a: 1, m: "Shared Value Framework: Use transparent, objective value/risk criteria to align competing priorities." },
      { id: 75, mode: "CORE", domain: "PEOPLE", tag: "Task 1.3 • Virtual Team Cohesion", q: "A newly distributed hybrid team across three time zones is struggling with miscommunication and low trust. What should you do FIRST?", opts: ["Mandate cameras-on for 8 hours a day.", "Facilitate a collaborative Team Charter session to establish working hours, communication norms, and core overlap windows.", "Assign all critical tasks to the co-located members.", "Send weekly motivational emails."], a: 1, m: "Team Charter & Norms: Co-creating a Team Charter establishes explicit working agreements and psychological trust." },

      // ==================== HARD MODE BANK (76 - 100) ====================
      { id: 76, mode: "HARD", domain: "PROCESS", tag: "Verb Trap: FIRST vs. Action", q: "You are managing a hybrid cloud migration where development teams run two-week sprints, while enterprise infrastructure cutovers follow a strict predictive change-control board (CCB). During Sprint 6, a senior security architect informs you that a newly discovered zero-day vulnerability in a third-party library requires upgrading the core authentication module, which will delay the upcoming phase-gate release by ten days. The Product Owner insists the team proceed with the release as planned and patch it in Sprint 7. What should you do FIRST?", opts: ["Submit a formal change request to the Change Control Board to extend the phase-gate release date by ten days.", "Assess the security impact, compliance exposure, and schedule/cost trade-offs with the security architect and Product Owner before proposing a path forward.", "Escalate the Product Owner's refusal to the project sponsor and Chief Information Security Officer immediately.", "Instruct the development team to halt sprint work and begin upgrading the authentication module immediately."], a: 1, m: "Assess Before Acting or Escalating: PMI's 'FIRST' rule always requires evaluating the technical/compliance impact and collaborating with key roles (PO + Architect) before submitting a change request or escalating." },
      { id: 77, mode: "HARD", domain: "PROCESS", tag: "Timeline Trap: SHOULD HAVE DONE", q: "A predictive enterprise data-warehouse project is entering user acceptance testing (UAT). Three regional finance directors refuse to sign off on the reporting module, claiming the dashboard metrics calculate fiscal year-end adjustments differently than their regional spreadsheets. The business analyst points out that the approved Business Requirements Document (BRD) did not specify regional adjustment formulas, though the finance directors were listed on the initial stakeholder register. What should the project manager have done to prevent this situation?", opts: ["Submitted a formal change request during execution to add regional formulas once UAT began.", "Engaged the regional finance directors during requirements elicitation and scope definition to document explicit, agreed-upon acceptance criteria.", "Required the project sponsor to sign off on the BRD on behalf of all regional finance directors.", "Used an agile approach so the finance directors could change formulas every two weeks."], a: 1, m: "Backward-Looking Prevention ('SHOULD HAVE DONE'): Being on the stakeholder register isn't enough. Requirements and acceptance criteria must be actively elicited and validated with key stakeholders during planning." },
      { id: 78, mode: "HARD", domain: "PROCESS", tag: "Hybrid Camouflage & Scope", q: "Your team is delivering a customer-facing mobile banking application using iterative two-week sprints, while backend mainframe integrations are governed by fixed regulatory milestones. Three days into Sprint 4, the VP of Retail Banking emails the lead developer directly asking to swap a planned UI story for an urgent promotional banner needed for a marketing campaign launching next week. The developer tells you she can finish it without affecting the sprint goal. What should you do?", opts: ["Allow the swap since the developer confirmed the sprint goal remains intact and the VP is a key sponsor.", "Facilitate a conversation between the VP of Retail Banking and the Product Owner to prioritize the request in the Product Backlog for a future sprint.", "Submit a formal change request to the Change Control Board to modify the Sprint 4 baseline.", "Reprimand the VP for bypassing project communication channels and violating the RACI matrix."], a: 1, m: "Hybrid Governance Discrimination: Sprint-level backlog priority belongs to the Product Owner, not a CCB and not a VP emailing developers directly. Route the VP to the PO while protecting the active sprint." },
      { id: 79, mode: "HARD", domain: "PROCESS", tag: "EVM & Forecasting Nuance", q: "At month six of a twelve-month predictive infrastructure build, your Earned Value report shows a BAC of $1,200,000, PV of $600,000, EV of $540,000, and AC of $600,000. Root-cause analysis reveals that the cost variance was caused by a one-time expedited shipping fee for specialized hardware that will not recur, and remaining work will proceed at the originally planned rate. What is the accurate Estimate at Completion (EAC)?", opts: ["$1,333,333", "$1,260,000", "$1,200,000", "$1,140,000"], a: 1, m: "EVM Formula Trap: Because the variance is explicitly stated as NON-RECURRING ('will not recur'), do NOT use BAC / CPI ($1.33M). Use atypical EAC = AC + (BAC - EV) = $600,000 + ($1,200,000 - $540,000) = $1,260,000." },
      { id: 80, mode: "HARD", domain: "PROCESS", tag: "Quality: Assurance vs. Control", q: "During a predictive medical-device software project, testing metrics reveal that 28% of completed code modules fail integration testing due to inconsistent API error-handling, forcing costly rework cycles. The test lead requests budget to hire two additional QA testers to catch bugs faster before release. What is the project manager's best response?", opts: ["Approve the hiring request using contingency reserves to accelerate defect detection.", "Conduct a root-cause analysis with the team and update coding standards, peer-review checklists, and automated CI checks to prevent the defects.", "Extend the integration testing phase in the schedule baseline via a formal change request.", "Require developers to work overtime to fix defects caught by the QA team."], a: 1, m: "Prevention Over Inspection: Hiring more testers only increases inspection costs. PMI prioritizes Quality Assurance (fixing the upstream process and standards) to prevent defects." },
      { id: 81, mode: "HARD", domain: "PROCESS", tag: "Risk vs. Issue vs. Reserve", q: "During planning for a cross-border logistics platform, the team identified a risk that customs clearance API changes might delay testing by two weeks and allocated $40,000 in contingency reserves for temporary manual data entry. Today, the customs agency unexpectedly shuts down the legacy API three months earlier than announced, halting automated testing immediately. What should the project manager do FIRST?", opts: ["Request management reserve funds from the sponsor since the shutdown occurred three months early.", "Log the event in the issue log, review the pre-planned risk response with the risk owner, and initiate the contingency plan.", "Update the risk register probability to 100% and wait for the next risk review meeting.", "Submit a change request to remove automated customs testing from the project scope."], a: 1, m: "Identified Risk Materializing: Because this risk was already identified and budgeted in contingency reserve ('known-unknown'), you do NOT need management reserve. Log as an issue and execute the contingency response." },
      { id: 82, mode: "HARD", domain: "PROCESS", tag: "Procurement & Contract Governance", q: "You are managing a vendor under a Time and Materials (T&M) contract with a Not-to-Exceed (NTE) ceiling of $300,000 to build a custom analytics engine. At 50% deliverable completion, the vendor has already billed $210,000 due to repeated design iterations requested by your internal product team. The vendor warns they will hit the $300,000 ceiling within three weeks. What should you do FIRST?", opts: ["Terminate the T&M contract for convenience and issue an RFP for a Firm Fixed Price vendor.", "Audit the billed hours against the Statement of Work, review change/iteration approvals with the product team, and evaluate scope/contract options.", "Immediately request a $150,000 contract ceiling increase from procurement and the sponsor.", "Instruct the vendor to complete the remaining 50% of the work within the $300,000 ceiling at their own expense."], a: 1, m: "Analyze Before Renegotiating: Audit timesheets and iteration approvals first to isolate root cause before modifying the contract." },
      { id: 83, mode: "HARD", domain: "PROCESS", tag: "Schedule Compression Trade-Off", q: "Your predictive telecommunications rollout has a CPI of 1.08 and an SPI of 0.84. A critical-path fiber-optic trenching vendor was delayed by municipal permitting, pushing your launch date past a contractual penalty deadline. You have $65,000 in unused cost variance, while underground utility maps for the remaining route are still incomplete. Which schedule recovery action should you evaluate FIRST?", opts: ["Fast-track trenching and conduit installation concurrently along the unmapped route to save time without spending money.", "Crash critical-path activities by funding additional weekend crews and overtime using available budget.", "Ask the customer to waive the contractual penalty deadline.", "Reduce quality inspection depth on completed trench segments."], a: 1, m: "Contextual Compression Choice: Fast-tracking on an unmapped utility route creates severe rework/safety risk, whereas CPI of 1.08 shows surplus budget to Crash critical-path tasks safely." },
      { id: 84, mode: "HARD", domain: "PROCESS", tag: "Communications & Stakeholder Friction", q: "Midway through a global ERP implementation, three regional operations leads complain in a steering committee meeting that they were blindsided by upcoming data-migration downtime windows, even though the exact schedule is published weekly in the shared project portal and emailed in the Friday status digest. What should the project manager do?", opts: ["Show the steering committee the email read-receipts and portal logs to prove the leads were notified.", "Meet with the regional leads to understand why the current communication channels are ineffective and update the Communications Management Plan and Stakeholder Engagement Plan.", "Add the regional leads to the daily technical standup calls.", "Send daily reminder emails leading up to every downtime window."], a: 1, m: "Never Blame the Receiver: Proving you sent an email is defensive. Diagnose their preferred medium/cadence and tailor the Communications Management Plan." },
      { id: 85, mode: "HARD", domain: "PROCESS", tag: "Agile Metrics & Flow Diagnosis", q: "Over the past four sprints, a Scrum team's velocity has remained steady at 32 story points per sprint, yet stakeholders complain that end-to-end features are taking twice as long to reach production. Examining the Kanban board reveals 14 items sitting in the 'Code Review / QA' column while developers continue pulling new stories into 'In Progress.' What should you coach the team to do?", opts: ["Increase story point estimates for QA tasks so velocity reflects testing effort.", "Establish explicit Work-in-Progress (WIP) limits and have developers swarm to clear the Code Review/QA bottleneck before starting new work.", "Add two more sprint days to give QA testers extra time at the end of each sprint.", "Split the team into separate Dev and QA Scrum teams."], a: 1, m: "Flow Efficiency Over Utilization: Enforcing WIP limits and swarming ('stop starting, start finishing') restores end-to-end flow." },
      { id: 86, mode: "HARD", domain: "PROCESS", tag: "Administrative & Procurement Closure", q: "All project deliverables for a defense logistics system have been formally accepted by the client, final lessons learned are archived, and team members are scheduled to roll off tomorrow. However, a subcontractor has filed a formal claim for $45,000 in disputed standby charges that will take legal counsel three months to arbitrate. How should the project manager proceed?", opts: ["Keep the entire project open and hold off on administrative closure until legal arbitration concludes.", "Follow organizational procurement closure procedures to document the open claim for legal resolution, close the contract per governance rules, and complete project closure.", "Pay the $45,000 out of contingency reserves today so the project can close cleanly.", "Close the project silently and leave the claim for the vendor to pursue."], a: 1, m: "Closure vs. Unresolved Claims: Document the disputed claim, hand off to formal dispute/legal governance per procurement procedures, and close the project." },
      { id: 87, mode: "HARD", domain: "PROCESS", tag: "Change Control Sequence", q: "During execution of a predictive manufacturing automation project, the engineering lead submits a change request to upgrade a robotic sensor array that improves accuracy by 15% and adds $18,000 to costs. The Change Control Board (CCB) reviews the impact analysis and formally approves the change request yesterday. What should the project manager do NEXT?", opts: ["Instruct the procurement team to order the upgraded sensors immediately.", "Update the project management plan, cost baseline, and technical specifications, and communicate the approved change to all affected stakeholders.", "Update the issue log and risk register.", "Ask the sponsor to sign a revised Project Charter."], a: 1, m: "Exact Post-CCB Sequence: Approved change -> Update baselines & plans -> Communicate to stakeholders -> Execute work." },
      { id: 88, mode: "HARD", domain: "BUSINESS", tag: "Compliance vs. Schedule Pressure", q: "Two weeks before launching a healthcare patient portal, a compliance officer notifies you that a newly enacted state biometric-privacy statute requires explicit opt-in consent screens before collecting voice authentication data. Implementing and auditing the consent workflow will delay launch by three weeks, risking a high-profile marketing event. The sponsor suggests launching on time with voice authentication active and adding the consent screen in a fast-follow patch. What should you do?", opts: ["Support the sponsor's plan to protect the marketing launch while logging a high-priority compliance risk.", "Explain the legal and regulatory noncompliance exposure to the sponsor, halt deployment of the non-compliant feature, and integrate the required compliance controls before launch.", "Ask the compliance officer to issue a temporary 30-day waiver.", "Launch on time but hide the voice authentication button in the UI."], a: 1, m: "Non-Negotiable Compliance: PMI never permits shipping a non-compliant product for schedule or marketing convenience." },
      { id: 89, mode: "HARD", domain: "BUSINESS", tag: "Benefits Realization & Pivot", q: "Eight months into a 14-month supply-chain optimization project, an unexpected industry-wide shift toward regional nearshoring reduces your company's overseas shipping volume by 60%, eliminating most of the projected cost savings in the original Business Case. What should the project manager do FIRST?", opts: ["Continue executing the remaining six months of scope since the project charter is already approved.", "Collaborate with the sponsor and business owner to re-evaluate the Business Case and Benefits Management Plan to determine whether to pivot, descope, or terminate the project.", "Submit a change request to add domestic trucking features to the scope baseline.", "Inform the team that the project will likely be canceled."], a: 1, m: "Business Case Viability: When external shifts invalidate the Business Case, immediately review viability with the sponsor before burning more capital." },
      { id: 90, mode: "HARD", domain: "BUSINESS", tag: "Organizational Change Resistance", q: "Your project is replacing a 15-year-old mainframe billing terminal with a modern cloud platform across 600 call-center representatives. Pilot testing shows the new system reduces call handling time by 25%, yet during pre-launch readiness checks, senior call-center supervisors express strong skepticism and predict productivity will collapse. What is the best action to ensure value realization?", opts: ["Have the VP of Customer Operations issue a mandatory compliance memo requiring immediate adoption on cutover day.", "Conduct a stakeholder and cultural readiness assessment with the supervisors, address workflow concerns, and engage respected floor leads as change champions and peer trainers.", "Postpone the launch by six months until supervisor turnover occurs.", "Hand off the system to IT operations at go-live since user adoption is an operational responsibility."], a: 1, m: "Organizational Change Management: Diagnose resistance drivers, co-opt skeptics/influencers as change champions, and tailor training." },
      { id: 91, mode: "HARD", domain: "BUSINESS", tag: "Governance Gate vs. Agile Autonomy", q: "Your agile software team works within a financial institution governed by a strict Enterprise Architecture Review Board (EARB) that meets biweekly to approve any new external cloud API integrations. The team is annoyed because waiting for EARB sign-off slows down their sprint demos and threatens their sprint commitments. What should you do?", opts: ["Allow the team to deploy external API integrations to production and seek retroactive EARB approval.", "Work with the team and Product Owner to incorporate EARB review lead times into backlog refinement and the Definition of Done (DoD).", "Ask the Scrum Master to cancel EARB reviews for agile projects.", "Switch the team from two-week sprints to six-week waterfall phases."], a: 1, m: "Enterprise Governance Alignment: Plan ahead by embedding corporate governance gates into Backlog Refinement and the Definition of Done." },
      { id: 92, mode: "HARD", domain: "BUSINESS", tag: "Outputs vs. Post-Launch Outcomes", q: "A customer self-service portal was delivered on schedule, 4% under budget, and passed all functional acceptance tests. Three months after project closure, the executive steering committee notes that call-center call volume has not decreased at all, failing the project's primary ROI objective. What was most likely missed during the project?", opts: ["Earned Value Management tracking during execution.", "End-user adoption planning, customer feedback loops, and transition metrics defined in the Benefits Management Plan.", "Earned schedule analysis during phase gates.", "Adding extra features to the final sprint."], a: 1, m: "Outputs vs. Outcomes: Realizing ROI requires user adoption, change enablement, and active tracking of the Benefits Management Plan." },
      { id: 93, mode: "HARD", domain: "BUSINESS", tag: "External Regulatory Ambiguity", q: "Halfway through building an AI-assisted underwriting tool, a federal agency publishes draft regulatory guidelines on algorithmic bias auditing that are expected to become mandatory next year, though final rules are still under public comment. What should the project manager do FIRST?", opts: ["Ignore the draft guidelines until final legislation passes so scope isn't disrupted.", "Engage legal, compliance, and technical leads to assess potential design impacts and log regulatory adaptation options in the risk register and backlog.", "Halt all development work until the federal agency publishes the final rule.", "Rewrite the underwriting algorithm immediately based on the draft text."], a: 1, m: "Proactive Environmental Scanning: Assess impact with compliance/tech experts and build flexibility into your risk register and backlog." },
      { id: 94, mode: "HARD", domain: "BUSINESS", tag: "Portfolio / Financial Value Selection", q: "Due to an enterprise capital freeze, your sponsor asks you to recommend which of two regulatory-compliant cloud modules to fund first: Module A requires $200,000, has a Net Present Value (NPV) of $310,000, and an Internal Rate of Return (IRR) of 14%; Module B requires $200,000, has an NPV of $195,000, and an IRR of 19% with a faster 10-month payback. Which should you recommend to maximize long-term enterprise value?", opts: ["Module B because its 19% IRR and 10-month payback recover capital faster.", "Module A because higher positive Net Present Value (NPV) directly measures greater net dollar wealth added to the organization.", "Split the $200,000 evenly across both modules.", "Defer both until interest rates drop."], a: 1, m: "NPV Trumps IRR & Payback: NPV is the gold-standard financial metric because it measures absolute net value created in today's dollars." },
      { id: 95, mode: "HARD", domain: "BUSINESS", tag: "Operational Handover & Sustainment", q: "As an automated warehouse robotics project nears final deployment, the facility's internal maintenance technicians express concern that they lack diagnostic tools and troubleshooting training to support the new robotics after the vendor's 30-day warranty expires. What should the project manager do?", opts: ["Extend the vendor's warranty by one year and close the project.", "Integrate structured hands-on shadowing, diagnostic documentation, and operational readiness sign-off into the transition plan prior to project closure.", "Log an operational risk for the facility manager to handle post-closure.", "Keep the project team assigned to the warehouse indefinitely."], a: 1, m: "Sustainable Handover: Build knowledge transfer and operational readiness verification into transition criteria prior to closure." },
      { id: 96, mode: "HARD", domain: "PEOPLE", tag: "Task 1.1: Vision & Charter Drift", q: "You are assigned to rescue a troubled cross-functional digital transformation project in Month 5. During your first stakeholder interviews, you discover that the VP of Sales expects a lead-generation tool, the COO expects an internal cost-cutting workflow engine, and the IT Director thinks the project is strictly a legacy database upgrade. What should you do FIRST?", opts: ["Review the existing Project Charter and Business Case, then facilitate a joint alignment workshop with all three executives and the sponsor to establish a unified vision and scope baseline.", "Prioritize the VP of Sales' requirements since sales directly generates company revenue.", "Ask the development team which architecture they have been building for the past five months.", "Issue three separate project charters to satisfy each department."], a: 0, m: "Task 1.1 (Build Shared Understanding): Anchor back to the charter/business case and facilitate executive alignment around one shared vision." },
      { id: 97, mode: "HARD", domain: "PEOPLE", tag: "Task 1.3: Servant Leadership vs. Rescuing", q: "An experienced agile team is two days away from a critical sprint demo when a database migration script fails repeatedly. Two senior developers begin arguing heatedly in the team channel about whether to roll back the schema or patch the script, paralyzing progress. As a servant leader, what should you do FIRST?", opts: ["Make the technical call to roll back the schema so the team doesn't miss the demo.", "Step in to de-escalate the tension, facilitate a brief time-boxed problem-solving huddle so the team evaluates trade-offs and owns the decision, and clear any external impediments.", "Report both developers to their functional engineering managers for unprofessional behavior.", "Cancel the sprint demo and reschedule it for next week."], a: 1, m: "Task 1.3 (Lead a Team): Servant leaders do NOT dictate technical solutions; de-escalate emotion and facilitate a structured team decision." },
      { id: 98, mode: "HARD", domain: "PEOPLE", tag: "Task 1.3: Psychological Safety & Culture", q: "During sprint retrospectives, a newly merged team of onshore and offshore engineers remains silent whenever you ask what could be improved, even though sprint commitments have been missed three times in a row. Later, an offshore developer privately messages you that teammates fear public criticism from senior onshore leads. What should you do?", opts: ["Read the offshore developer's feedback aloud anonymously at the next retrospective and confront the onshore leads.", "Redesign the retrospective format using anonymous silent brainstorming, co-create Team Charter norms around psychological safety and blameless learning, and coach senior leads on inclusive facilitation.", "Hold separate retrospectives for onshore and offshore engineers permanently.", "Ask HR to conduct mandatory sensitivity training."], a: 1, m: "Psychological Safety & Team Norms: Use structured anonymous facilitation and establish explicit Team Charter norms for blameless collaboration." },
      { id: 99, mode: "HARD", domain: "PEOPLE", tag: "Task 1.1: Product Owner Alignment", q: "In a hybrid product rollout, a newly hired Product Owner reprioritizes the entire Q3 release backlog to focus on sleek mobile UI animations, pushing back core backend compliance and billing stability stories requested by Finance and Operations. Finance threatens to withdraw project funding. What should you do?", opts: ["Tell Finance that the Product Owner has absolute authority over the backlog and cannot be overruled.", "Facilitate a value-alignment session between the Product Owner, Finance, Operations, and the sponsor to evaluate strategic risk, compliance dependencies, and business value across the backlog.", "Override the Product Owner and move the Finance stories back to the top of the sprint.", "Ask the development team to secretly work on Finance stories during spare capacity."], a: 1, m: "Collaborative Vision Alignment: Facilitate a transparent value-and-risk trade-off discussion before funding or compliance is jeopardized." },
