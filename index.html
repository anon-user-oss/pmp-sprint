<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PMP Retake Sprint — 75-Question Mastery Bank</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --correct: #22c55e;
      --correct-bg: rgba(34, 197, 94, 0.16);
      --wrong: #ef4444;
      --wrong-bg: rgba(239, 68, 68, 0.16);
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; max-width: 680px; margin: 0 auto; line-height: 1.45; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.05rem; font-weight: 700; color: var(--accent); }
    .stats { font-size: 0.78rem; color: var(--muted); font-weight: 600; text-align: right; }
    .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
    .filter-btn { background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 6px 11px; border-radius: 999px; font-size: 0.76rem; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .filter-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    .tag-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .domain-tag { color: var(--accent); }
    .task-tag { background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 2px 8px; border-radius: 4px; }
    .question-text { font-size: 0.96rem; font-weight: 500; margin-bottom: 16px; }
    .options { display: flex; flex-direction: column; gap: 8px; }
    .option-btn { background: rgba(15, 23, 42, 0.7); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: left; font-size: 0.9rem; cursor: pointer; }
    .option-btn.correct { background: var(--correct-bg); border-color: var(--correct); color: #bbf7d0; }
    .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: #fecaca; }
    .rationale { margin-top: 14px; padding: 12px; background: rgba(2, 132, 199, 0.14); border-left: 3px solid var(--accent); border-radius: 6px; font-size: 0.85rem; display: none; }
    .rationale strong { color: var(--accent); display: block; margin-bottom: 3px; }
    .controls { display: flex; gap: 8px; }
    .nav-btn { flex: 1; padding: 12px 8px; border-radius: 8px; border: none; font-weight: 700; font-size: 0.88rem; cursor: pointer; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); flex: 0.6; }
    .btn-primary { background: var(--accent); color: #0f172a; flex: 1.4; }
    .btn-primary:disabled { opacity: 0.35; }
  </style>
</head>
<body>

  <header>
    <h1>PMP Sprint (75)</h1>
    <div class="stats" id="stats">Score: 0/0</div>
  </header>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="ALL">All (75)</button>
    <button class="filter-btn" data-filter="PROCESS">Process (35)</button>
    <button class="filter-btn" data-filter="BUSINESS">Business Env (25)</button>
    <button class="filter-btn" data-filter="PEOPLE">People 1.1 & 1.3 (15)</button>
    <button class="filter-btn" data-filter="MISSED">Missed (0)</button>
  </div>

  <div class="card">
    <div class="tag-row">
      <span class="domain-tag" id="domain-label">PROCESS</span>
      <span class="task-tag" id="task-label">Task</span>
    </div>
    <div class="question-text" id="question-text">Loading...</div>
    <div class="options" id="options-container"></div>
    <div class="rationale" id="rationale-box"></div>
  </div>

  <div class="controls">
    <button class="nav-btn btn-danger" onclick="resetProgress()">Reset</button>
    <button class="nav-btn btn-secondary" onclick="shuffleDeck()">Shuffle</button>
    <button class="nav-btn btn-primary" id="next-btn" disabled onclick="nextQuestion()">Next →</button>
  </div>

  <script>
    const questionBank = [
      // ==================== PROCESS (1 - 35) ====================
      { id: 1, domain: "PROCESS", task: "Task 2.2 • Scope", q: "During execution of a predictive infrastructure project, a key stakeholder asks the lead developer to add a minor reporting widget that takes four hours and costs nothing extra. The developer adds it. What should you do FIRST?", opts: ["Allow it since cost and schedule impact are zero.", "Evaluate the impact of the change and submit a formal change request through Perform Integrated Change Control.", "Reprimand the developer for gold plating.", "Update the WBS and scope baseline immediately."], a: 1, m: "Baseline Integrity: Any unapproved scope change in predictive projects—even a 'free' addition—must be evaluated and routed through formal change control." },
      { id: 2, domain: "PROCESS", task: "Task 2.3 • Value Delivery", q: "Midway through a hybrid transformation project, the sponsor is concerned that stakeholders have not seen tangible business benefits yet despite green milestone reports. What is your best action?", opts: ["Reassure the sponsor that benefits realize at project closure.", "Crash the critical path to finish early.", "Collaborate with stakeholders and the product owner to reprioritize deliverables for earlier incremental value release.", "Submit a change request to cut remaining scope."], a: 2, m: "Value-Based Delivery: PMI expects incremental, early value delivery rather than waiting until the end of the lifecycle." },
      { id: 3, domain: "PROCESS", task: "Task 2.7 • Quality", q: "Quality control inspections repeatedly catch the same configuration defect, causing rework and delays. What should you prioritize?", opts: ["Add more quality control inspectors at phase gates.", "Conduct root-cause analysis and update quality assurance processes to prevent defects from occurring.", "Use contingency reserves for overtime.", "Escalate the defect trend to the sponsor."], a: 1, m: "Prevention Over Inspection: Build quality into processes (Quality Assurance) rather than adding end-of-line inspections." },
      { id: 4, domain: "PROCESS", task: "Task 2.5 • Procurement", q: "Three proposals arrive for a high-risk federal compliance module: Vendor A is cheapest but lacks compliance history; Vendor B is mid-priced with proven experience; Vendor C is premium. How do you guide selection?", opts: ["Select Vendor A to preserve cost baseline.", "Evaluate proposals against predefined source selection criteria balancing risk allocation, technical capability, and value.", "Ask the sponsor to pick their favorite.", "Split the contract between A and B."], a: 1, m: "Procurement Value Rule: Never fall for the lowest-cost trap; select based on agreed source selection criteria, risk, and value." },
      { id: 5, domain: "PROCESS", task: "Task 2.1 • Integration", q: "You lead a complex system modernization where user workflows are rapidly evolving, but regulatory sign-offs mandate strict milestone documentation. Which approach should you recommend?", opts: ["Pure predictive waterfall.", "Pure agile with zero upfront documentation.", "A tailored hybrid approach combining iterative delivery for evolving workflows with predictive governance gates.", "Delay planning until all regulations freeze."], a: 2, m: "Tailoring Rule: Tailor delivery methodologies (predictive, agile, or hybrid) to match project uncertainty and governance requirements." },
      { id: 6, domain: "PROCESS", task: "Task 2.6 • Finance", q: "An unexpected regulatory mandate requires adding an encryption layer not accounted for in the original scope or risk register. Which funding source covers this cost?", opts: ["Contingency reserve, approved by the PM.", "Management reserve, requested through formal change control.", "Cost baseline padding.", "Operations maintenance budget."], a: 1, m: "Reserve Governance: Contingency covers 'known-unknowns' (identified risks); Management reserve covers 'unknown-unknowns' (unforeseen in-scope work) via formal approval." },
      { id: 7, domain: "PROCESS", task: "Task 2.10 • Risk", q: "During sprint planning, the team identifies a third-party API deprecation that could halt integration in two months. What should you do FIRST?", opts: ["Log it in the risk register, analyze probability and impact, and assign a risk owner.", "Immediately rewrite the integration layer.", "Escalate to the steering committee.", "Move the story to the bottom of the backlog."], a: 0, m: "Risk Process Order: Identify -> Analyze (Qualitative/Quantitative) -> Plan Response -> Implement. Never jump straight to action before assessing impact." },
      { id: 8, domain: "PROCESS", task: "Task 2.4 • Schedule", q: "An external vendor informs you that a critical-path server delivery will be delayed by two weeks. You have zero float on that path and cannot add budget. Which technique should you evaluate FIRST?", opts: ["Crashing the critical path.", "Fast-tracking dependent activities to run in parallel where risk allows.", "Reducing project quality standards.", "Submitting a baseline extension immediately."], a: 1, m: "Schedule Compression: Crashing adds cost; Fast-tracking overlaps sequential activities at no direct cost (though it increases rework risk)." },
      { id: 9, domain: "PROCESS", task: "Task 2.8 • Scope/Backlog", q: "In an agile project, a key stakeholder demands adding three high-priority features mid-sprint because of a new customer contract. How should you respond?", opts: ["Add the features to the current sprint immediately.", "Collaborate with the Product Owner to add them to the product backlog for reprioritization in the next sprint.", "Reject the features until the release finishes.", "Ask the team to work weekends to absorb them."], a: 1, m: "Agile Sprint Protection: Protect the active sprint backlog; route new requests to the Product Owner to prioritize in the Product Backlog." },
      { id: 10, domain: "PROCESS", task: "Task 2.12 • Artifacts", q: "A new sponsor joins mid-project and asks for a single view of how project deliverables map back to business objectives and requirements. Which artifact should you share?", opts: ["Work Breakdown Structure (WBS).", "Requirements Traceability Matrix (RTM).", "RACI Chart.", "Issue Log."], a: 1, m: "Artifact Precision: The Requirements Traceability Matrix links product requirements from origin through deliverables that satisfy business objectives." },
      { id: 11, domain: "PROCESS", task: "Task 2.11 • Change Control", q: "The Change Control Board (CCB) approves a major scope addition that extends the schedule by three weeks. What must the project manager do NEXT?", opts: ["Instruct the team to begin work immediately.", "Update the project management plan, scope baseline, schedule baseline, and communicate updates to stakeholders.", "Log the decision in the lessons learned register and wait.", "Re-baseline the project charter."], a: 1, m: "Post-CCB Execution: After CCB approval, always update baselines/plans and communicate changes to affected stakeholders before executing." },
      { id: 12, domain: "PROCESS", task: "Task 2.13 • Closure", q: "All deliverables have been accepted by the customer and final payments are processed, but one vendor dispute remains open. Can you close the project?", opts: ["Yes, vendor disputes are handled by legal post-closure.", "Follow formal procurement closure procedures, document the unresolved claim, and complete administrative closure per governance.", "Keep the entire project team on billing until the dispute settles.", "Cancel the vendor contract retroactively."], a: 1, m: "Closure Governance: Follow organizational procurement closure rules and archive lessons learned; unresolved claims follow formal dispute resolution procedures." },
      { id: 13, domain: "PROCESS", task: "Task 2.6 • Earned Value", q: "Your project's CPI is 0.82 and SPI is 1.05. What does this indicate about project performance?", opts: ["Under budget and behind schedule.", "Over budget and ahead of schedule.", "Under budget and ahead of schedule.", "Over budget and behind schedule."], a: 1, m: "EVM Rule: Less than 1.0 is unfavorable; greater than 1.0 is favorable. CPI 0.82 = over budget; SPI 1.05 = ahead of schedule." },
      { id: 14, domain: "PROCESS", task: "Task 2.9 • Communications", q: "A remote stakeholder complains they are missing critical status updates, even though you email a 20-page weekly report every Friday. What should you do?", opts: ["Highlight key sections in yellow for that stakeholder.", "Review the Communications Management Plan and stakeholder engagement needs to tailor format and frequency.", "Add the stakeholder to daily standups.", "Send the report twice a week."], a: 1, m: "Tailored Communication: When communication fails, revisit stakeholder preferences and update the Communications Management Plan." },
      { id: 15, domain: "PROCESS", task: "Task 2.6 • EVM Forecasting", q: "Your project has a Budget at Completion (BAC) of $500,000, Earned Value (EV) of $200,000, and Actual Cost (AC) of $250,000. Assuming current cost efficiency continues, what is the Estimate at Completion (EAC)?", opts: ["$550,000", "$625,000", "$450,000", "$600,000"], a: 1, m: "EVM Math: CPI = EV / AC = 200k / 250k = 0.80. Typical EAC = BAC / CPI = $500,000 / 0.80 = $625,000." },
      { id: 16, domain: "PROCESS", task: "Task 2.5 • Contract Types", q: "You need to hire a specialized AI research firm for an R&D prototype where the exact scope of work cannot be clearly defined upfront, and you want to incentivize cost control. Which contract type fits best?", opts: ["Firm Fixed Price (FFP)", "Cost Plus Incentive Fee (CPIF)", "Cost Plus Percentage of Cost (CPPC)", "Time and Materials (T&M) with no cap"], a: 1, m: "Contract Selection: When scope is evolving, use cost-reimbursable; CPIF shares cost savings/overruns to align incentives (CPPC is illegal/banned in federal/PMI best practice)." },
      { id: 17, domain: "PROCESS", task: "Task 2.7 • Quality Control", q: "A control chart for a manufacturing deliverable shows seven consecutive data points trending upward below the upper control limit. What does this 'Rule of Seven' indicate?", opts: ["The process is within control limits and requires no action.", "An assignable cause of non-random variation exists; investigate the process immediately.", "The upper specification limit must be widened.", "Inspection frequency should be reduced."], a: 1, m: "Rule of Seven: Seven consecutive points on one side of the mean or trending in one direction indicates a non-random trend requiring process investigation even before breaching control limits." },
      { id: 18, domain: "PROCESS", task: "Task 2.10 • Risk Responses", q: "To address a severe hurricane risk to a coastal data center build, the team decides to lease a secondary inland facility to host primary servers instead. Which risk response strategy is this?", opts: ["Mitigate", "Transfer", "Avoid", "Accept"], a: 2, m: "Risk Strategies: Relocating the asset completely eliminates the coastal hurricane threat—that is Avoidance (Mitigation reduces probability/impact; Transfer shifts financial ownership to a third party)." },
      { id: 19, domain: "PROCESS", task: "Task 2.10 • Risk Responses", q: "A senior cloud architect may leave the company midway through a critical migration. You cross-train two mid-level engineers on her proprietary workflows now. Which strategy is this?", opts: ["Avoid", "Mitigate", "Transfer", "Exploit"], a: 1, m: "Risk Mitigation: Cross-training does not stop her from leaving (not Avoid), but it lowers the impact if she does." },
      { id: 20, domain: "PROCESS", task: "Task 2.4 • Agile Metrics", q: "An agile team's velocity has dropped from 38 points to 24 points over the last three sprints, and cycle time is climbing. What should you examine FIRST with the team?", opts: ["Increase story point estimates for upcoming items.", "Review the Kanban/task board to identify bottlenecks, excessive Work in Progress (WIP), or unresolved impediments.", "Extend sprint length from two weeks to three weeks.", "Replace underperforming developers."], a: 1, m: "Flow & Bottlenecks: Rising cycle time and dropping velocity point to excessive WIP or blocked dependencies; limit WIP and clear bottlenecks." },
      { id: 21, domain: "PROCESS", task: "Task 2.2 • Scope Validation", q: "During Validate Scope, the customer rejects a completed deliverable because it fails to meet one of the documented acceptance criteria. What should the project manager do NEXT?", opts: ["Submit a change request to modify the acceptance criteria.", "Document the non-conformance, issue a change request for defect repair, and have the team rework the deliverable.", "Close the phase and fix it during warranty.", "Ask the sponsor to override the customer."], a: 1, m: "Validate Scope vs. Control Quality: Rejected deliverables during Validate Scope require formal defect repair change requests and rework." },
      { id: 22, domain: "PROCESS", task: "Task 2.8 • Agile Artifacts", q: "In an agile project, who is accountable for ensuring the Product Backlog is ordered to maximize business value and communicating product vision?", opts: ["Scrum Master / Agile Coach", "Product Owner", "Project Sponsor", "Development Team Lead"], a: 1, m: "Agile Roles: The Product Owner owns the Product Backlog, prioritization, and maximizing business value; the Scrum Master facilitates process and removes impediments." },
      { id: 23, domain: "PROCESS", task: "Task 2.11 • Change Control", q: "A team member suggests a technical refactoring improvement that reduces long-term maintenance cost without changing external functionality, schedule, or budget. How should it be handled in a predictive project?", opts: ["Implement it silently since baselines aren't affected.", "Assess whether it impacts any project baselines or quality plans; if it alters technical specs or baseline components, submit a change request.", "Ask the sponsor for verbal approval.", "Wait until project closure."], a: 1, m: "Change Discipline: Always evaluate technical changes for hidden impacts on quality, risk, or baselines before implementing." },
      { id: 24, domain: "PROCESS", task: "Task 2.4 • Schedule Network", q: "Activity A (5 days) and Activity B (8 days) both feed into Activity C (4 days), which is the final activity. If Activity A is delayed by 2 days, what happens to the total project duration?", opts: ["Increases by 2 days.", "Remains 12 days because Activity A has 3 days of total float.", "Increases by 1 day.", "Decreases by 2 days."], a: 1, m: "Critical Path & Float: Critical path is B (8) + C (4) = 12 days. Path A + C = 9 days, giving Activity A 3 days of float. A 2-day delay absorbs float without delaying the project." },
      { id: 25, domain: "PROCESS", task: "Task 2.1 • Methodology", q: "An organization transitioning from waterfall to agile insists on keeping detailed upfront 18-month Gantt charts while running two-week sprints. What is the PM's best approach?", opts: ["Refuse to create the Gantt chart.", "Educate leadership on rolling-wave planning and establish a high-level milestone roadmap mapped to iterative release goals.", "Abandon agile sprints and revert to waterfall.", "Create fake Gantt tasks to satisfy management."], a: 1, m: "Hybrid Translation: Bridge executive governance and agile execution using high-level release roadmaps and rolling-wave planning rather than rigid micro-Gantts." },
      { id: 26, domain: "PROCESS", task: "Task 2.12 • Knowledge Mgmt", q: "Midway through a multi-year program, two key lead engineers resign, taking critical architectural context with them. What should the PM have established earlier to prevent this?", opts: ["Strict non-compete agreements.", "A continuous lessons learned repository and collaborative knowledge-sharing practices (e.g., pair programming, shared wikis).", "Higher overtime pay.", "A larger management reserve."], a: 1, m: "Knowledge Management: Capture tacit and explicit knowledge continuously throughout the project—not just at closure." },
      { id: 27, domain: "PROCESS", task: "Task 2.5 • Procurement", q: "A time-and-materials (T&M) vendor is billing significantly faster than anticipated, threatening to exhaust the contract ceiling before 60% of the work is done. What should you do FIRST?", opts: ["Terminate the contract immediately.", "Audit vendor timesheets/deliverables against the SOW, evaluate burn rate, and negotiate corrective controls or scope caps.", "Request management reserve to cover the overrun.", "Switch the contract to Firm Fixed Price unilaterally."], a: 1, m: "Procurement Control: T&M contracts carry high buyer cost risk; actively audit burn rates, deliverables, and not-to-exceed caps." },
      { id: 28, domain: "PROCESS", task: "Task 2.3 • MVP / Value", q: "Stakeholders are divided on 40 potential features for a new customer portal, delaying project kickoff. How should you help them move forward?", opts: ["Build all 40 features in Phase 1.", "Facilitate a prioritization workshop (e.g., MoSCoW or Kano) to define a Minimum Viable Product (MVP) for rapid feedback.", "Let the IT director pick the top 10.", "Extend the planning phase by two months."], a: 1, m: "MVP Mindset: Use structured prioritization to isolate the Minimum Viable Product (MVP), validate assumptions early, and deliver fast value." },
      { id: 29, domain: "PROCESS", task: "Task 2.7 • Cost of Quality", q: "To avoid expensive post-deployment production outages, your team invests heavily in automated unit testing, peer code reviews, and developer training. Which Cost of Quality category is this?", opts: ["Internal Failure Costs", "External Failure Costs", "Prevention Costs", "Appraisal Costs"], a: 2, m: "Cost of Quality: Training, process design, and built-in quality practices are Prevention Costs (testing/inspections are Appraisal; rework is Internal Failure; outages/warranty are External Failure)." },
      { id: 30, domain: "PROCESS", task: "Task 2.10 • Risk Audit", q: "During execution, you want to evaluate whether your team's risk response plans and overall risk management processes are actually working effectively. Which tool should you use?", opts: ["Qualitative Risk Analysis", "Risk Audit", "Monte Carlo Simulation", "Sensitivity Analysis"], a: 1, m: "Risk Process Review: A Risk Audit examines and documents the effectiveness of risk responses and the risk management process itself." },
      { id: 31, domain: "PROCESS", task: "Task 2.6 • Budgeting", q: "When aggregating cost estimates from individual work packages up through control accounts to establish the cost baseline, which reserve is INCLUDED inside the cost baseline?", opts: ["Management Reserve", "Contingency Reserve", "Operational Overhead Reserve", "Profit Margin"], a: 1, m: "Cost Baseline Formula: Work Package Estimates + Contingency Reserves = Cost Baseline. Cost Baseline + Management Reserves = Total Project Budget." },
      { id: 32, domain: "PROCESS", task: "Task 2.9 • Stakeholder Comms", q: "A key regulatory stakeholder has high power over your project's approval but currently shows low interest in day-to-day updates. How should you manage them per the Power/Interest Grid?", opts: ["Monitor only with minimal effort.", "Keep Satisfied—provide concise, targeted executive compliance updates without overwhelming them.", "Manage Closely with daily check-ins.", "Keep Informed of every technical sprint task."], a: 1, m: "Power/Interest Grid: High Power + Low Interest = Keep Satisfied. (High/High = Manage Closely; Low Power/High Interest = Keep Informed; Low/Low = Monitor)." },
      { id: 33, domain: "PROCESS", task: "Task 2.8 • Backlog Refinement", q: "During sprint planning, the team spends three hours arguing over unclear user stories, leaving little time to plan sprint tasks. What should you recommend for future sprints?", opts: ["Extend sprint planning to a full day.", "Hold regular Backlog Refinement sessions mid-sprint so upcoming stories meet the Definition of Ready (DoR).", "Have the Scrum Master write all acceptance criteria.", "Skip estimation and start coding."], a: 1, m: "Backlog Refinement: Ongoing refinement ensures top backlog items are clear, sized, and meet the Definition of Ready before Sprint Planning." },
      { id: 34, domain: "PROCESS", task: "Task 2.13 • Phase Gate", q: "At the end of Phase 2 of a predictive construction project, two non-critical documentation items are incomplete, while all safety and engineering deliverables are signed off. What should happen at the phase gate?", opts: ["Automatically halt Phase 3 until every paper document is filed.", "Review phase gate criteria with governance stakeholders to decide whether to proceed conditionally while closing minor gaps.", "Delete the two documentation items from the WBS.", "Restart Phase 2 from scratch."], a: 1, m: "Phase Gate Governance: Phase gates evaluate performance against criteria to decide whether to pass, pass with conditions, hold, or terminate." },
      { id: 35, domain: "PROCESS", task: "Task 2.11 • Configuration Mgmt", q: "Two engineering teams accidentally overwrite each other's API schema changes because both worked off outdated specification files. Which system failed?", opts: ["Earned Value Management System", "Configuration Management and Version Control System", "Resource Breakdown Structure", "Issue Escalation Matrix"], a: 1, m: "Configuration Management: Tracks and controls physical and functional specs, versions, and documentation consistency across deliverables." },

      // ==================== BUSINESS ENVIRONMENT (36 - 60) ====================
      { id: 36, domain: "BUSINESS", task: "Task 3.2 • Compliance", q: "A developer flags a newly enacted data privacy law affecting user storage, though an internal compliance audit isn't scheduled for nine months. What should you do FIRST?", opts: ["Continue building and address findings during the audit.", "Assess the compliance requirement, evaluate noncompliance consequences, and integrate controls into the project plan.", "Log it as a low-priority risk for closure.", "Ask legal for a temporary waiver."], a: 1, m: "Proactive Compliance: Integrate regulatory and compliance controls immediately—never wait for an audit." },
      { id: 37, domain: "BUSINESS", task: "Task 3.7 • Org Change", q: "Your project replaces a legacy case-management system for 400 staff. Technical testing is green, but department supervisors are skeptical. What is your best action?", opts: ["Launch on schedule and have leadership mandate usage.", "Assess organizational culture and readiness, identify resistance drivers, and execute targeted engagement and training.", "Delay launch until skepticism disappears.", "Close the project post-deployment since adoption is operational."], a: 1, m: "Organizational Readiness: Assess cultural readiness and proactively manage change adoption rather than forcing mandates." },
      { id: 38, domain: "BUSINESS", task: "Task 3.8 • External Env", q: "Halfway through a 12-month product build, a competitor launches a disruptive AI feature that renders two of your planned features obsolete. What do you FIRST?", opts: ["Continue building the signed-off scope.", "Evaluate the external shift's impact on business value and collaborate with stakeholders to reprioritize scope/backlog.", "Cancel the project immediately.", "Withhold the competitor news to protect team morale."], a: 1, m: "External Vigilance: Continuously scan the external environment and adapt plans/backlogs when market shifts impact business value." },
      { id: 39, domain: "BUSINESS", task: "Task 3.4 & 3.5 • Risk vs Issue", q: "A key vendor informs you today that a hardware shipment is held at customs, blocking tomorrow's integration test. How do you handle this?", opts: ["Add it to the risk register and score its probability.", "Log it in the issue log, assess immediate impact, and collaborate on workaround options to remove the blocker.", "Escalate immediately to the sponsor.", "Spend contingency reserves without evaluating options."], a: 1, m: "Risk vs. Issue: A risk is future/uncertain; once it occurs, it is an ISSUE. Log it in the issue log and resolve blockers at the lowest level." },
      { id: 40, domain: "BUSINESS", task: "Task 3.1 • Benefits Realization", q: "Six months into a multi-phase enterprise rollout, senior leadership questions whether the investment is still justified due to budget tightening. Which document defines how value will be measured and sustained?", opts: ["Project Charter.", "Benefits Management Plan.", "Scope Management Plan.", "Quality Checklist."], a: 1, m: "Benefits Governance: The Benefits Management Plan outlines target benefits, metrics, ownership, and timeframes for realizing business value." },
      { id: 41, domain: "BUSINESS", task: "Task 3.3 • Governance", q: "During an agile release, the team discovers that a key security sign-off requires formal architecture review board approval before production deployment. What should you do?", opts: ["Deploy to production anyway to preserve sprint velocity.", "Incorporate the organizational governance gate into the Definition of Done (DoD) and release plan.", "Ask the Product Owner to waive the security review.", "Switch the entire project to waterfall."], a: 1, m: "Governance Alignment: Organizational governance gates are non-negotiable; embed them into your Definition of Done and release cadence." },
      { id: 42, domain: "BUSINESS", task: "Task 3.6 • Business Value", q: "Two requested features have equal development effort: Feature X aligns with a core strategic regulatory mandate; Feature Y is a popular cosmetic UI request from internal users. How should you guide prioritization?", opts: ["Prioritize Feature Y for quick internal adoption.", "Prioritize Feature X because it delivers higher strategic and compliance business value.", "Split sprint capacity 50/50 between both.", "Let the developers vote on which one to build."], a: 1, m: "Strategic Alignment: Always prioritize work based on strategic business value, risk reduction, and compliance impact." },
      { id: 43, domain: "BUSINESS", task: "Task 3.2 • Compliance Risk", q: "A vendor delivers a software component using an open-source license that conflicts with your company's commercial intellectual property policy. What should you do FIRST?", opts: ["Ignore it since the code works properly.", "Document the compliance breach, assess legal/IP impact, and engage the vendor and legal counsel for remediation.", "Replace the vendor immediately.", "Hide the license file from the repository."], a: 1, m: "Compliance Integrity: Escalate and remediate IP/licensing violations immediately; never ship non-compliant deliverables." },
      { id: 44, domain: "BUSINESS", task: "Task 3.8 • Regulatory Shift", q: "A new federal cybersecurity directive is announced mid-project, tightening encryption standards for cloud workloads. What is your FIRST step?", opts: ["Immediately purchase new encryption tools.", "Analyze the directive's impact on project scope, schedule, cost, and compliance baselines with technical leads.", "Wait until the directive's enforcement deadline next year.", "Inform the sponsor the project will miss its deadline."], a: 1, m: "Impact Assessment First: Whenever an external regulation shifts, assess the exact impact on project baselines before proposing changes." },
      { id: 45, domain: "BUSINESS", task: "Task 3.7 • Knowledge Transfer", q: "As your project transitions a new cloud platform to internal IT operations, the operations team expresses anxiety about supporting unfamiliar architecture. What ensures sustainable adoption?", opts: ["Hand over the architecture diagram at closure.", "Execute structured knowledge transfer, joint shadowing, and operational readiness training prior to handover.", "Keep the project team on permanent support.", "Log an operational risk and close the project."], a: 1, m: "Sustainable Transition: Operational readiness requires structured knowledge transfer and enablement before project closure." },
      { id: 46, domain: "BUSINESS", task: "Task 3.1 • Business Case", q: "During execution of a retail analytics project, a corporate merger shifts company strategy away from brick-and-mortar stores toward e-commerce only. What should you do FIRST?", opts: ["Continue executing the approved charter until told otherwise.", "Meet with the sponsor and governance board to re-evaluate the business case and strategic alignment of the project.", "Pivot the project to e-commerce on your own authority.", "Accelerate the current schedule to finish before budgets freeze."], a: 1, m: "Strategic Viability: When corporate strategy shifts, validate whether the project's Business Case still holds value with the sponsor." },
      { id: 47, domain: "BUSINESS", task: "Task 3.2 • Compliance Audit", q: "An internal quality and compliance audit reveals that two sprint teams skipped mandatory accessibility testing to meet a release deadline. What should you do?", opts: ["Accept the technical debt and move to the next feature.", "Halt release sign-off for non-compliant items, log remediation stories, and reinforce compliance in the Definition of Done.", "Ask the customer to sign a liability waiver.", "Reassign the QA testers."], a: 1, m: "Non-Negotiable Compliance: Compliance standards cannot be traded off for schedule speed; remediate gaps and enforce them via DoD." },
      { id: 48, domain: "BUSINESS", task: "Task 3.3 • PMO Governance", q: "You join a matrix organization with a Directive PMO. Your team wants to use lightweight Kanban boards instead of the PMO's standardized stage-gate templates. What should you do?", opts: ["Ignore the PMO templates since agile values working software over documentation.", "Consult with the PMO to tailor their governance framework so Kanban metrics map cleanly to required stage-gate controls.", "Escalate to the CEO to disband the PMO.", "Maintain two completely separate sets of project books."], a: 1, m: "PMO & Tailoring: A Directive PMO enforces compliance; collaborate to tailor governance artifacts rather than bypassing organizational rules." },
      { id: 49, domain: "BUSINESS", task: "Task 3.6 • Value Realization", q: "Your software product launched on time and under budget, but 60 days post-launch, customer adoption metrics are 70% below target. What does this indicate?", opts: ["The project was a complete success because the triple constraint was met.", "Outputs were delivered, but expected business outcomes and value realization are falling short; analyze user feedback and adoption barriers.", "The operations team failed to market the tool.", "No action is needed since the project is closed."], a: 1, m: "Outputs vs. Outcomes: Delivering features on time is only an output; true project success requires realizing intended business outcomes and adoption." },
      { id: 50, domain: "BUSINESS", task: "Task 3.7 • Change Champions", q: "During an enterprise ERP rollout across 12 regional offices, resistance is highest in regional billing departments. What is the most effective change management tactic?", opts: ["Send weekly executive warning emails to billing managers.", "Recruit respected peer 'change champions' within billing to co-design workflows, pilot early, and peer-coach colleagues.", "Delay billing migration until all other departments finish.", "Outsource regional billing during the cutover."], a: 1, m: "Change Adoption: Peer champions and early user involvement build organic trust and reduce resistance far better than top-down mandates." },
      { id: 51, domain: "BUSINESS", task: "Task 3.8 • Supply Chain / PESTLE", q: "Geopolitical tariffs suddenly increase the import cost of specialized networking hardware by 35% before your purchase order is finalized. What should you do FIRST?", opts: ["Cancel the hardware order.", "Assess budget impact, evaluate alternative domestic suppliers or specifications, and present options to the sponsor/CCB.", "Use contingency reserves without notifying anyone.", "Force the vendor to absorb the tariff."], a: 1, m: "External Economic Shifts (PESTLE): Analyze cost/schedule impacts and explore alternative sourcing options before requesting reserve funds or baseline changes." },
      { id: 52, domain: "BUSINESS", task: "Task 3.2 • Data Sovereignty", q: "Your cloud application is expanding to European users, and a stakeholder asks to replicate production databases to a US server for faster analytics. What must you verify FIRST?", opts: ["Network latency benchmarks.", "GDPR and cross-border data residency compliance requirements with legal/privacy officers.", "Storage cost differences between regions.", "Database backup schedules."], a: 1, m: "Regulatory Boundaries: Cross-border data storage triggers strict legal/compliance constraints (GDPR/data residency) that supersede technical convenience." },
      { id: 53, domain: "BUSINESS", task: "Task 3.1 • NPV / ROI Selection", q: "Leadership is choosing between two mutually exclusive projects: Project Alpha has an NPV of $420,000 and payback period of 18 months; Project Beta has an NPV of $610,000 and payback period of 20 months. Based purely on financial value, which should be selected?", opts: ["Project Alpha because its payback period is faster.", "Project Beta because higher positive Net Present Value (NPV) maximizes overall financial return.", "Neither, because payback exceeds 12 months.", "Split funding across both projects."], a: 1, m: "Financial Selection Rule: When comparing mutually exclusive investments, NPV accounts for the time value of money and total wealth creation—always prefer higher NPV." },
      { id: 54, domain: "BUSINESS", task: "Task 3.4 • Escalation vs Action", q: "A third-party regulatory agency delays issuing an environmental permit needed for site excavation, and the delay exceeds your project's contingency thresholds and authority. What should you do?", opts: ["Begin excavation without the permit to protect the critical path.", "Escalate the issue to the project sponsor and governance committee with an impact analysis and mitigation options.", "Log it in the risk register and wait.", "Reassign the excavation crew indefinitely."], a: 1, m: "Appropriate Escalation: When external threats or issues breach project tolerance thresholds and lie outside PM authority, escalate promptly with clear options." },
      { id: 55, domain: "BUSINESS", task: "Task 3.7 • Organizational Culture", q: "You are hired to lead an agile transformation in a traditional, hierarchical organization where managers punish missed estimates. Teams are padding estimates by 300%. What is the root cultural issue to address?", opts: ["Teach the teams better Planning Poker techniques.", "Coach leadership on psychological safety and empirical forecasting so estimates are treated as forecasts rather than rigid commitments.", "Enforce stricter time-tracking software.", "Replace team leads who pad estimates."], a: 1, m: "Cultural Alignment: Agile practices fail in punitive cultures; leaders must shift from punishing variance to fostering psychological safety and empirical learning." },
      { id: 56, domain: "BUSINESS", task: "Task 3.6 • Incremental ROI", q: "Your project is building a 10-module enterprise platform. Module 1 and Module 2 alone can automate 65% of manual processing costs. What should you recommend?", opts: ["Hold Modules 1 and 2 until all 10 modules pass final integration testing.", "Release Modules 1 and 2 early to capture immediate cost savings and fund/validate subsequent modules.", "Reduce testing on Modules 3–10.", "Re-estimate the entire project."], a: 1, m: "Early Value Capture: Releasing high-value increments early accelerates ROI, proves value to stakeholders, and reduces overall project risk." },
      { id: 57, domain: "BUSINESS", task: "Task 3.3 • Compliance Escalation", q: "A senior business stakeholder pressures you to bypass a mandatory financial segregation-of-duties control to speed up user acceptance testing. How should you respond?", opts: ["Temporarily disable the control during UAT and re-enable it later.", "Refuse to bypass the compliance control, explain the audit/regulatory risk, and escalate to governance/compliance if pressured further.", "Ask the developer to create a hidden admin account.", "Log it as an accepted risk."], a: 1, m: "Ethical & Compliance Backbone: Never compromise mandatory compliance, ethics, or audit controls for stakeholder convenience." },
      { id: 58, domain: "BUSINESS", task: "Task 3.8 • Tech Obsolescence", q: "A core open-source framework your team relies on announces end-of-life security support six months before your product's planned launch. What should you do FIRST?", opts: ["Continue using it since it still compiles.", "Assess technical migration effort, security compliance risks, and schedule/cost impacts with the architecture team.", "Immediately rewrite the application in a new language.", "Cancel the launch."], a: 1, m: "External Tech Risk: End-of-life dependencies create severe security/compliance exposure; quantify migration options and impacts before executing a pivot." },
      { id: 59, domain: "BUSINESS", task: "Task 3.1 • Benefit Ownership", q: "During project closure, you are preparing to hand off the deliverables to business operations. Who is responsible for tracking and realizing the long-term financial benefits after the project closes?", opts: ["The Project Manager.", "The Business Owner / Benefit Owner designated in the Benefits Management Plan.", "The Scrum Master.", "The PMO Director."], a: 1, m: "Benefit Ownership: The PM delivers the capability; the designated Business/Benefit Owner is accountable for sustaining and measuring post-project benefits." },
      { id: 60, domain: "BUSINESS", task: "Task 3.7 • Training & Enablement", q: "A new customer service CRM goes live next Monday, but 40% of support agents haven't completed mandatory system training due to high call volumes. What should you recommend?", opts: ["Go live on Monday anyway and let agents learn on live calls.", "Collaborate with operations leadership to schedule staggered coverage for training or adjust cutover readiness criteria to prevent service disruption.", "Cancel training and send a PDF manual.", "Blame the call center managers in the status report."], a: 1, m: "Operational Readiness: Launching without trained end-users destroys value realization; collaborate to resolve operational readiness gaps before cutover." },

      // ==================== PEOPLE 1.1 & 1.3 (61 - 75) ====================
      { id: 61, domain: "PEOPLE", task: "Task 1.1 • Common Vision", q: "During a sprint review, two department heads argue over project success—one measures deployment speed, the other measures zero defects. What should you do FIRST?", opts: ["Side with the more senior stakeholder.", "Facilitate a session to uncover the root cause of misalignment and establish a shared definition of success.", "Refer both to the charter and end the meeting.", "Have the team work overtime to satisfy both."], a: 1, m: "Shared Vision (Task 1.1): Diagnose root causes of stakeholder misalignment and facilitate consensus around shared goals." },
      { id: 62, domain: "PEOPLE", task: "Task 1.3 • Lead Team", q: "A self-organizing agile team is deadlocked between two technical architectures, causing daily standups to drag past 40 minutes. As a servant leader, what should you do?", opts: ["Make the architectural decision yourself.", "Facilitate a dedicated technical spike or decision workshop empowering the team to evaluate trade-offs and choose.", "Escalate to the enterprise architecture board.", "Extend daily standups permanently."], a: 1, m: "Servant Leadership (Task 1.3): Coach, facilitate, and remove impediments so the team can make informed decisions." },
      { id: 63, domain: "PEOPLE", task: "Task 1.1 • Conflict/Vision", q: "A newly appointed Product Owner wants to pivot the product roadmap away from the original business case without consulting key operational stakeholders. How should you intervene?", opts: ["Let the Product Owner pivot immediately since they own the backlog.", "Facilitate alignment between the Product Owner, sponsor, and key stakeholders to validate strategic value before shifting.", "Refuse to update the backlog.", "Escalate to HR."], a: 1, m: "Aligned Vision: While the PO owns backlog priority, major strategic pivots require stakeholder alignment against business value." },
      { id: 64, domain: "PEOPLE", task: "Task 1.3 • Team Empowerment", q: "A junior team member hesitates to share a potential design flaw during retrospective because senior engineers dominate the conversation. What should you do?", opts: ["Ask the junior member to email you privately after meetings.", "Establish psychological safety and use structured facilitation techniques (like silent brainstorming) so all voices are heard.", "Speak on behalf of the junior engineer.", "Remove senior engineers from the retrospective."], a: 1, m: "Servant Leadership & Safety: Foster an inclusive, psychologically safe environment where every team member contributes openly." },
      { id: 65, domain: "PEOPLE", task: "Task 1.3 • Situational Leadership", q: "A newly formed team is struggling with agile ceremonies and lacks clarity on roles, causing sprint velocity to stall. Which leadership style is most appropriate right now?", opts: ["Hands-off delegation.", "Coaching and mentoring the team on agile practices while clarifying roles and expectations.", "Command-and-control micromanagement.", "Replacing underperforming members."], a: 1, m: "Situational Leadership: Newly formed teams need active coaching, clarity, and support before transitioning to full self-organization." },
      { id: 66, domain: "PEOPLE", task: "Task 1.1 • Stakeholder Alignment", q: "Key stakeholders from Finance and Engineering have conflicting interpretations of a major milestone deliverable's acceptance criteria. What is your FIRST action?", opts: ["Ask the sponsor to pick one interpretation.", "Bring both groups together to review the requirements, clarify ambiguity, and document mutually agreed acceptance criteria.", "Build both versions to be safe.", "Defer the milestone."], a: 1, m: "Collaborative Alignment: Resolve ambiguous expectations directly with stakeholders to lock down clear, shared acceptance criteria." },
      { id: 67, domain: "PEOPLE", task: "Task 1.3 • Conflict Resolution", q: "Two senior developers frequently clash in code reviews over coding standards, creating tension across the entire team. What is the best conflict resolution approach?", opts: ["Smooth over the tension and tell them to be polite.", "Facilitate a problem-solving (collaborating) session with the team to establish shared team coding standards in the Team Charter.", "Force them to adopt your personal coding style.", "Separate them onto different projects."], a: 1, m: "Collaborate / Problem-Solve: PMI favors confronting issues collaboratively to reach a win-win consensus codified in the Team Charter." },
      { id: 68, domain: "PEOPLE", task: "Task 1.1 • Vision Drift", q: "Midway through a 9-month project, team members tell you they feel disconnected from why their daily tasks matter to end users. What should you do?", opts: ["Remind them of their contractual job descriptions.", "Organize a session with the Product Owner and end users to reconnect the team with customer outcomes and product vision.", "Offer spot bonuses for sprint completion.", "Increase daily status reporting."], a: 1, m: "Purpose & Vision: High-performing teams need clear line-of-sight between their daily work and real customer value." },
      { id: 69, domain: "PEOPLE", task: "Task 1.3 • Servant Leadership", q: "A functional manager pulls your lead QA engineer onto an urgent operational ticket for three days without consulting you, jeopardizing your sprint goal. What should you do FIRST?", opts: ["Report the functional manager to senior executives.", "Meet directly with the functional manager to discuss project impact, resource agreements, and negotiate coverage.", "Ask the developers to skip QA testing this sprint.", "Accept the delay silently."], a: 1, m: "Collaborative Negotiation: Address resource conflicts directly and constructively with functional managers using project impact data." },
      { id: 70, domain: "PEOPLE", task: "Task 1.1 • Sponsor Misalignment", q: "Your project sponsor frequently bypasses you to assign ad-hoc tasks directly to developers, disrupting sprint commitments and confusing priorities. How should you handle this?", opts: ["Tell the developers to ignore the sponsor.", "Meet privately with the sponsor to align on governance, explain how direct tasking disrupts value delivery, and channel requests through the backlog.", "Add a buffer to every sprint to absorb sponsor requests.", "Escalate to the PMO."], a: 1, m: "Protecting Team & Alignment: Educate sponsors on how unified backlog governance protects their own strategic priorities." },
      { id: 71, domain: "PEOPLE", task: "Task 1.3 • Emotional Intelligence", q: "During a tense post-incident review, a team lead becomes defensive and blames another team for a deployment failure. How should you respond?", opts: ["Publicly reprimand the team lead for unprofessionalism.", "Use emotional intelligence to de-escalate blame, refocus the room on blameless system/process improvement, and facilitate constructive root-cause analysis.", "End the meeting immediately.", "Escalate the lead's behavior to HR."], a: 1, m: "Emotional Intelligence & Blameless Culture: De-escalate defensiveness and pivot the group toward systemic learning rather than personal blame." },
      { id: 72, domain: "PEOPLE", task: "Task 1.1 • Charter & Vision", q: "You are taking over an in-flight project where three key stakeholders hold completely different expectations about final deliverables. What is your FIRST step?", opts: ["Review the Project Charter and Stakeholder Register, then hold a joint alignment workshop to establish a unified baseline vision.", "Continue executing the current schedule to avoid losing momentum.", "Ask each stakeholder to send you a separate wish list.", "Rewrite the charter unilaterally."], a: 0, m: "Diagnose & Align First: When inheriting misaligned projects, verify foundational governance docs and align stakeholders around one shared vision." },
      { id: 73, domain: "PEOPLE", task: "Task 1.3 • Delegation & Trust", q: "A high-performing, mature agile team asks to run their own sprint retrospectives and dependency coordination without your direct facilitation. How should you respond?", opts: ["Refuse, because facilitating ceremonies is strictly the PM's job.", "Support their self-organization, empower them to lead the sessions, and remain available for coaching and impediment removal.", "Observe silently and grade their facilitation.", "Assign a senior developer as formal boss."], a: 1, m: "Empowerment & Maturity: As teams mature, a servant leader steps back from directing and empowers full team autonomy." },
      { id: 74, domain: "PEOPLE", task: "Task 1.1 • Value Alignment", q: "During backlog prioritization, Marketing wants customer-facing cosmetic features while Operations insists on backend stability upgrades. How do you facilitate consensus?", opts: ["Let Marketing win because they generate revenue.", "Facilitate a joint value-scoring exercise weighing customer impact, operational risk, and strategic goals with the Product Owner.", "Alternate one marketing story and one ops story blindly.", "Ask the sponsor to break every tie."], a: 1, m: "Shared Value Framework: Use transparent, objective value/risk criteria to align competing stakeholder priorities." },
      { id: 75, domain: "PEOPLE", task: "Task 1.3 • Virtual Team Cohesion", q: "A newly distributed hybrid team across three time zones is struggling with miscommunication and low trust. What should you do FIRST?", opts: ["Mandate cameras-on for 8 hours a day.", "Facilitate a collaborative Team Charter session to establish working hours, communication norms, and core overlap windows.", "Assign all critical tasks to the co-located members.", "Send weekly motivational emails."], a: 1, m: "Team Charter & Norms: Co-creating a Team Charter establishes explicit working agreements, core hours, and psychological trust across distributed teams." }
    ];

    const STORAGE_KEY = "pmp_sprint_75_state";
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      score: 0,
      answeredCount: 0,
      missedIds: [],
      answeredIds: []
    };

    let missedIds = new Set(state.missedIds);
    let answeredIds = new Set(state.answeredIds);
    let activeDeck = [...questionBank];
    let currentIndex = 0;
    let currentFilter = "ALL";

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        score: state.score,
        answeredCount: state.answeredCount,
        missedIds: Array.from(missedIds),
        answeredIds: Array.from(answeredIds)
      }));
    }

    function updateStats() {
      const pct = state.answeredCount > 0 ? Math.round((state.score / state.answeredCount) * 100) : 0;
      document.getElementById("stats").textContent = `Score: ${state.score}/${state.answeredCount} (${pct}%) • Q ${activeDeck.length ? currentIndex + 1 : 0}/${activeDeck.length}`;
      const missedBtn = document.querySelector('[data-filter="MISSED"]');
      if (missedBtn) missedBtn.textContent = `Missed (${missedIds.size})`;
    }

    function applyFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.filter === filter));
      if (filter === "ALL") activeDeck = [...questionBank];
      else if (filter === "MISSED") activeDeck = questionBank.filter(q => missedIds.has(q.id));
      else activeDeck = questionBank.filter(q => q.domain === filter);
      currentIndex = 0;
      renderQuestion();
    }

    function renderQuestion() {
      const ratBox = document.getElementById("rationale-box");
      const nextBtn = document.getElementById("next-btn");
      const optsContainer = document.getElementById("options-container");
      ratBox.style.display = "none";
      nextBtn.disabled = true;

      if (activeDeck.length === 0) {
        document.getElementById("domain-label").textContent = "CLEAR";
        document.getElementById("task-label").textContent = "0 Left";
        document.getElementById("question-text").textContent = currentFilter === "MISSED" ? "Zero missed questions in your queue! Switch back to All (75) or Shuffle." : "No questions in this filter.";
        optsContainer.innerHTML = "";
        updateStats();
        return;
      }

      const item = activeDeck[currentIndex];
      document.getElementById("domain-label").textContent = `${item.domain} • #${item.id}`;
      document.getElementById("task-label").textContent = item.task;
      document.getElementById("question-text").textContent = item.q;
      optsContainer.innerHTML = "";

      item.opts.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = `${String.fromCharCode(65 + idx)}. ${opt}`;
        btn.onclick = () => handleAnswer(idx, btn);
        optsContainer.appendChild(btn);
      });
      updateStats();
    }

    function handleAnswer(selectedIdx, selectedBtn) {
      const item = activeDeck[currentIndex];
      const allBtns = document.querySelectorAll(".option-btn");
      allBtns.forEach(b => b.onclick = null);

      state.answeredCount++;
      answeredIds.add(item.id);

      if (selectedIdx === item.a) {
        selectedBtn.classList.add("correct");
        state.score++;
        missedIds.delete(item.id);
      } else {
        selectedBtn.classList.add("wrong");
        allBtns[item.a].classList.add("correct");
        missedIds.add(item.id);
      }

      saveState();

      const ratBox = document.getElementById("rationale-box");
      ratBox.innerHTML = `<strong>PMI Mindset Rule:</strong>${item.m}`;
      ratBox.style.display = "block";
      document.getElementById("next-btn").disabled = false;
      updateStats();
    }

    function nextQuestion() {
      currentIndex = (currentIndex + 1) % activeDeck.length;
      renderQuestion();
    }

    function shuffleDeck() {
      for (let i = activeDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [activeDeck[i], activeDeck[j]] = [activeDeck[j], activeDeck[i]];
      }
      currentIndex = 0;
      renderQuestion();
    }

    function resetProgress() {
      if (!confirm("Reset your saved score and missed queue?")) return;
      state = { score: 0, answeredCount: 0, missedIds: [], answeredIds: [] };
      missedIds.clear();
      answeredIds.clear();
      saveState();
      applyFilter(currentFilter);
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      if (e.target.classList.contains("filter-btn")) applyFilter(e.target.dataset.filter);
    });

    renderQuestion();
  </script>
