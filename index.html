      { id: 100, mode: "HARD", domain: "PEOPLE", tag: "Task 1.3: Situational Leadership", q: "Six months ago, you took over a newly formed hybrid team that lacked agile experience and required heavy hands-on coaching, daily facilitation, and structured guidance. Today, the team consistently meets sprint goals, resolves cross-functional dependencies proactively, and self-organizes effectively. How should you adapt your leadership approach?", opts: ["Maintain the exact same directive oversight to ensure performance never slips.", "Transition toward a delegating and empowering servant-leadership style, stepping back from daily execution decisions while focusing on strategic alignment and organizational impediment removal.", "Assign the most senior developer as a formal sub-manager to enforce rules.", "Increase status reporting frequency to track their autonomy."], a: 1, m: "Situational Leadership (Hersey-Blanchard): As team competence and commitment mature, shift from Coaching/Directing to Delegating." }, // ==================== DEEP-DIVE PEOPLE 1.1 & 1.3 (101 - 120) ====================

    const STORAGE_KEY = "pmp_hub_100_state";
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      score: 0,
      answeredCount: 0,
      missedIds: [],
      masteredIds: []
    };

    let missedIds = new Set(state.missedIds || []);
    let masteredIds = new Set(state.masteredIds || []);
    let currentMode = "CORE"; // CORE or HARD
    let currentFilter = "ALL";
    let activeDeck = [];
    let currentIndex = 0;

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        score: state.score,
        answeredCount: state.answeredCount,
        missedIds: Array.from(missedIds),
        masteredIds: Array.from(masteredIds)
      }));
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById("btn-mode-core").className = mode === "CORE" ? "mode-card active-core" : "mode-card";
      document.getElementById("btn-mode-hard").className = mode === "HARD" ? "mode-card active-hard" : "mode-card";
      
      const nextBtn = document.getElementById("next-btn");
      nextBtn.className = mode === "HARD" ? "nav-btn btn-primary hard" : "nav-btn btn-primary";
      
      rebuildDeck();
    }

    function updateProgressCounts(modePool) {
      const unseenCount = modePool.filter(q => !masteredIds.has(q.id) && !missedIds.has(q.id)).length;
      const masteredCount = modePool.filter(q => masteredIds.has(q.id)).length;

      const unseenBtn = document.querySelector('[data-filter="UNSEEN"]');
      const masteredBtn = document.querySelector('[data-filter="MASTERED"]');
      const summaryEl = document.getElementById("progress-summary");

      if (unseenBtn) unseenBtn.textContent = `Unseen (${unseenCount})`;
      if (masteredBtn) masteredBtn.textContent = `Mastered (${masteredCount})`;
      if (summaryEl) {
        summaryEl.textContent = `${currentMode} Progress: ${masteredCount}/${modePool.length} Mastered • ${unseenCount} Unseen`;
      }
    }

    function rebuildDeck() {
      document.getElementById("core-card-title").textContent = `Core Mindset (${fullBank.filter(q => q.mode === "CORE").length})`;
      document.getElementById("hard-card-title").textContent = `Hard Mode (${fullBank.filter(q => q.mode === "HARD").length})`;
      const modePool = fullBank.filter(q => q.mode === currentMode);
      
      // Update filter button counts dynamically for active mode
      document.querySelector('[data-filter="ALL"]').textContent = `All (${modePool.length})`;
      document.querySelector('[data-filter="PROCESS"]').textContent = `Process (${modePool.filter(q => q.domain === "PROCESS").length})`;
      document.querySelector('[data-filter="BUSINESS"]').textContent = `Business Env (${modePool.filter(q => q.domain === "BUSINESS").length})`;
      document.querySelector('[data-filter="PEOPLE"]').textContent = `People (${modePool.filter(q => q.domain === "PEOPLE").length})`;
      document.querySelector('[data-filter="MISSED"]').textContent = `Missed (${missedIds.size})`;
      updateProgressCounts(modePool);

      document.querySelectorAll(".filter-btn").forEach(btn => {
        const isActive = btn.dataset.filter === currentFilter;
        btn.classList.toggle("active", isActive);
        btn.classList.toggle("hard-accent", isActive && currentMode === "HARD");
      });

      let filteredPool = [];
      if (currentFilter === "MISSED") {
        filteredPool = fullBank.filter(q => missedIds.has(q.id));
      } else if (currentFilter === "UNSEEN") {
        filteredPool = modePool.filter(q => !masteredIds.has(q.id) && !missedIds.has(q.id));
      } else if (currentFilter === "MASTERED") {
        filteredPool = modePool.filter(q => masteredIds.has(q.id));
      } else if (currentFilter === "ALL") {
        filteredPool = [...modePool];
      } else {
        filteredPool = modePool.filter(q => q.domain === currentFilter);
      }

      // Unseen-First Ordering: 0 = Unseen, 1 = Missed, 2 = Mastered
      const getRank = (id) => (!masteredIds.has(id) && !missedIds.has(id) ? 0 : missedIds.has(id) ? 1 : 2);
      activeDeck = filteredPool
        .map(q => ({ q, sortKey: getRank(q.id) + Math.random() * 0.9 }))
        .sort((a, b) => a.sortKey - b.sortKey)
        .map(entry => entry.q);

      currentIndex = 0;
      renderQuestion();
    }

    function updateStats() {
      const pct = state.answeredCount > 0 ? Math.round((state.score / state.answeredCount) * 100) : 0;
      document.getElementById("stats").textContent = `Score: ${state.score}/${state.answeredCount} (${pct}%) • Q ${activeDeck.length ? currentIndex + 1 : 0}/${activeDeck.length}`;
      document.querySelector('[data-filter="MISSED"]').textContent = `Missed (${missedIds.size})`;
      updateProgressCounts(fullBank.filter(q => q.mode === currentMode));
    }

   let currentCorrectShuffledIdx = 0;

    function renderQuestion() {
      const ratBox = document.getElementById("rationale-box");
      const nextBtn = document.getElementById("next-btn");
      const optsContainer = document.getElementById("options-container");
      const domLabel = document.getElementById("domain-label");
      const trapLabel = document.getElementById("trap-label");

      ratBox.style.display = "none";
      nextBtn.disabled = true;
      nextBtn.textContent = "Next →";

      if (activeDeck.length === 0 || currentIndex >= activeDeck.length) {
        domLabel.textContent = "SESSION COMPLETE";
        trapLabel.textContent = "0 Left";
        document.getElementById("question-text").textContent = currentFilter === "MISSED" 
          ? "Zero missed questions left in your queue! Switch back to Unseen or All." 
          : currentFilter === "UNSEEN"
          ? "You cleared every unseen question in this filter! Review Missed or switch modes."
          : "You completed all questions in this deck! Tap Shuffle or switch filters to run another pass.";
        optsContainer.innerHTML = "";
        updateStats();
        return;
      }

      const item = activeDeck[currentIndex];
      const isHard = item.mode === "HARD";

      domLabel.textContent = `${isHard ? "HARD • " : ""}${item.domain} • #${item.id}`;
      domLabel.className = isHard ? "domain-tag hard" : "domain-tag";

      trapLabel.textContent = item.tag;
      trapLabel.className = isHard ? "trap-tag hard" : "trap-tag";

      document.getElementById("question-text").textContent = item.q;
      optsContainer.innerHTML = "";

      // Shuffle options so button positions (A/B/C/D) cannot be memorized on repeats
      const indexedOpts = item.opts.map((text, originalIdx) => ({
        text,
        isCorrect: originalIdx === item.a
      }));
      for (let i = indexedOpts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indexedOpts[i], indexedOpts[j]] = [indexedOpts[j], indexedOpts[i]];
      }
      currentCorrectShuffledIdx = indexedOpts.findIndex(o => o.isCorrect);

      indexedOpts.forEach((optObj, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = `${String.fromCharCode(65 + idx)}. ${optObj.text}`;
        btn.onclick = () => handleAnswer(idx, btn);
        optsContainer.appendChild(btn);
      });
      updateStats();
    }

    function handleAnswer(selectedIdx, selectedBtn) {
      const item = activeDeck[currentIndex];
      const allBtns = document.querySelectorAll(".option-btn");
      allBtns.forEach(b => b.onclick = null);

      state.answeredCount++;

      if (selectedIdx === currentCorrectShuffledIdx) {
        selectedBtn.classList.add("correct");
        state.score++;
        missedIds.delete(item.id);
        masteredIds.add(item.id);
      } else {
        selectedBtn.classList.add("wrong");
        allBtns[currentCorrectShuffledIdx].classList.add("correct");
        missedIds.add(item.id);
        masteredIds.delete(item.id);
      }

      saveState();

      const isHard = item.mode === "HARD";
      const ratBox = document.getElementById("rationale-box");
      ratBox.className = isHard ? "rationale hard" : "rationale";
      ratBox.innerHTML = `<strong>${isHard ? "PMI Trap Breakdown:" : "PMI Mindset Rule:"}</strong>${item.m}`;
      ratBox.style.display = "block";
      
      const nextBtn = document.getElementById("next-btn");
      nextBtn.disabled = false;
      if (currentIndex === activeDeck.length - 1) {
        nextBtn.textContent = "Finish Deck ✓";
      }
      updateStats();
    }

    function nextQuestion() {
      currentIndex++;
      renderQuestion();
    }
    function shuffleDeck() {
      for (let i = activeDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [activeDeck[i], activeDeck[j]] = [activeDeck[j], activeDeck[i]];
      }
      currentIndex = 0;
      renderQuestion();
    }

    function resetProgress() {
      if (!confirm("Reset your saved score, mastered, and missed queue across all questions?")) return;
      state = { score: 0, answeredCount: 0, missedIds: [], masteredIds: [] };
      missedIds.clear();
      masteredIds.clear();
      saveState();
      rebuildDeck();
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      if (e.target.classList.contains("filter-btn")) {
        currentFilter = e.target.dataset.filter;
        rebuildDeck();
      }
    });

    rebuildDeck();
  </script>
